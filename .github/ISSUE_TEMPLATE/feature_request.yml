name: Feature request
description: Propose an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Break the Wall reads the structure of a source and lets you explore how it holds together, with every block and link tied to its source lines.
        Exploring is the core; running and reassembling come later. There is one loop for every subject.
        It is not a course, a chatbot, a summarizer or a flashcard app, and it has no subject-specific modes.
        Please read the [product definition](https://github.com/simoneriggi92/BreakTheWall/blob/main/docs/product.md) before proposing.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to understand or do, and where the app got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What should change. A sketch or a mock-up helps.
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Which part of the exploration it serves
      options:
        - The structure (aspects, roles, components, joints)
        - The guides
        - The card
        - The source and its index
        - How it was read
        - Generation and sources
        - Claude (MCP)
        - Disassemblies (earlier loop)
        - Something else
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
