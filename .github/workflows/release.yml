name: Release

# A v* tag builds the Apple Silicon DMG and the Windows x64 setup and attaches them to the tag's release, as a draft
# pre-release titled from the CHANGELOG when there is none yet; the owner publishes that draft. A pull request that
# touches packaging, or a manual run, only builds them as workflow artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-*.mjs
      - src/desktop/main.ts
      - src/desktop/app-files.ts
      - src/desktop/squirrel.ts
      - assets/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Apple Silicon DMG
    # Named explicitly: the DMG is arm64 and its start check opens it, so the runner must be Apple Silicon.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      # engine-strict is on: use the npm version pinned in package.json.
      - run: npm install --global npm@10.9.8
      - name: The runner is Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: break-the-wall-dmg
          path: release/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 setup
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install --global npm@10.9.8
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run check
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: break-the-wall-windows-setup
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      # The draft takes its title and notes from the version's CHANGELOG section, so the owner recognizes it and only
      # publishes it: a release made by hand next to it gets no files.
      - name: The CHANGELOG has a section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v head="## [${TAG#v}]" '
            index($0, head) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/section.md"
          if [ ! -s "$RUNNER_TEMP/section.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
          # The first paragraph is the version's summary: the title, unless the section starts with a heading or a list.
          title=$(head -n 1 "$RUNNER_TEMP/section.md")
          if [ -n "$title" ] && ! printf '%s' "$title" | grep -q '^[#*-]'; then
            echo "${title%.}" > "$RUNNER_TEMP/title.txt"
            tail -n +2 "$RUNNER_TEMP/section.md" | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          else
            echo "Break the Wall $TAG" > "$RUNNER_TEMP/title.txt"
            cp "$RUNNER_TEMP/section.md" "$RUNNER_TEMP/notes.md"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: break-the-wall-dmg
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: break-the-wall-windows-setup
          path: release
      - name: Upload the DMG, the setup and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --draft --prerelease --verify-tag --title "$(cat "$RUNNER_TEMP/title.txt")" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
