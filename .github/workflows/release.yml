name: Release

# A v* tag builds the Claude Code plugin and writes it to the orphan `plugin` branch, tagged plugin-v<version>, the tag
# the marketplace on main pins (#107), then drafts the tag's GitHub release titled from the CHANGELOG; the owner
# publishes that draft. A release ships the plugin only (#130): the Electron app is frozen, so the Apple Silicon DMG and
# the Windows x64 setup are built only by a pull request that touches packaging, or a manual run, as workflow artifacts.
# CI packs the plugin on every pull request.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-*.mjs
      - src/desktop/main.ts
      - src/desktop/app-files.ts
      - src/desktop/squirrel.ts
      - assets/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Apple Silicon DMG
    # Not part of a release (#130): the frozen app is only kept buildable.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # Named explicitly: the DMG is arm64 and its start check opens it, so the runner must be Apple Silicon.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      # engine-strict is on: use the npm version pinned in package.json.
      - run: npm install --global npm@10.9.8
      - name: The runner is Apple Silicon
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: break-the-wall-dmg
          path: release/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 setup
    # Not part of a release (#130): the frozen app is only kept buildable.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: break-the-wall-windows-setup
          path: release/
          if-no-files-found: error
          retention-days: 14

  plugin:
    name: Claude Code plugin
    # The plugin is plain files, the same on every platform: the server and its launcher bundled into one file each, the
    # built page, the mod and its hooks. No lockfile and no package manifest ship, so installing it runs no install step.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run build:plugin
      # Refuses a tag that is not package.json's version, and a marketplace on main that does not pin plugin-v<version>.
      # Off a tag, it packs package.json's version.
      - name: Pack the plugin
        id: pack
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: node scripts/pack-plugin.mjs "${RELEASE_TAG:-v$(node -p "require('./package.json').version")}" "$RUNNER_TEMP/plugin"
      - run: npm install --global @anthropic-ai/claude-code@2.1.330
      - name: Claude Code reads the packed plugin
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: claude plugin validate "$RUNNER_TEMP/plugin"
      # The branch holds only the plugin, one commit per release on top of the last, so main keeps no build output. The
      # commit is made from the packed folder with its own index, without touching the checkout.
      - name: Write it to the plugin branch and tag it
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ steps.pack.outputs.tag }}
          VERSION: ${{ steps.pack.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists: a plugin tag is written once, and installs may already pin it"
            exit 1
          fi
          parent=()
          if git fetch --no-tags --depth=1 origin plugin; then parent=(-p FETCH_HEAD); fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/plugin.index"
          git -C "$RUNNER_TEMP/plugin" --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add --all
          commit=$(git commit-tree "$(git write-tree)" ${parent[@]+"${parent[@]}"} -m "Break the Wall plugin $VERSION" -m "Built from $GITHUB_SHA ($GITHUB_REF_NAME).")
          unset GIT_INDEX_FILE
          git push origin "$commit:refs/heads/plugin" "$commit:refs/tags/$TAG"

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    # After the plugin tag exists, so the release never announces a plugin the marketplace cannot install.
    needs: [plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            package.json
            scripts/plugin-release.mjs
            scripts/release-notes.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      # The draft takes its title and notes from the version's CHANGELOG section, so the owner recognizes it and only
      # publishes it. The packing already refused a version with no section, before the plugin tag was written.
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP"
      # A release candidate must not become the repository's latest release, which the README's downloads point to.
      - name: Draft the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a release: nothing to draft"
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft ${prerelease[@]+"${prerelease[@]}"} --verify-tag --title "$(cat "$RUNNER_TEMP/title.txt")" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
