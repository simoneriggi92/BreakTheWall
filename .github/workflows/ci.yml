name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and build
    # The app targets macOS, so its checks run there.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      # engine-strict is on: use the npm version pinned in package.json.
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: 'Windows: types, tests and build'
    # Keeps the app working on Windows (plan P-20261027-windows-alpha). The macOS job above keeps the name the
    # main ruleset requires.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Start check
        env:
          BTW_SMOKE_TEST: '1'
        run: BTW_USER_DATA_DIR="$RUNNER_TEMP/btw-start-check" npm start
