name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and build
    # The app targets macOS, so its checks run there.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      # engine-strict is on: use the npm version pinned in package.json.
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run check
      - run: npm run build
