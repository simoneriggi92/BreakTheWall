<!doctype html>
<!-- The 1280 × 640 social preview, rendered by `npm run brand` to .github/assets/social-preview.png. -->
<html lang="en"><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #f4f0e6; color: #1d2733; font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(29, 39, 51, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(29, 39, 51, .06) 1px, transparent 1px); background-size: 24px 24px; }
.text { position: absolute; left: 64px; top: 70px; width: 540px; }
.text img { width: 470px; display: block; }
h1 { font-size: 30px; line-height: 1.3; font-weight: 600; margin: 38px 0 18px; }
.loop { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 21px; color: #4c5866; letter-spacing: .03em; }
.loop b { color: #b4532f; font-weight: 600; }
.facts { position: absolute; left: 64px; bottom: 56px; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; color: #4c5866; letter-spacing: .08em; text-transform: uppercase; }
.shot { position: absolute; right: -60px; top: 70px; width: 680px; height: 500px; border: 1px solid #cdc4b1; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(29, 39, 51, .18); }
.shot img { width: 100%; display: block; }
</style></head><body><div class="grid"></div>
<div class="text">
  <img src="wordmark.svg" alt="Break the Wall: take the text apart.">
  <h1>AI gives you a wall of text. Break the Wall reads its structure and lets you explore how it holds together, down to its source lines.</h1>
  <div class="loop">a source <b>→</b> its structure <b>→</b> explore it</div>
</div>
<div class="facts">Open source · Apache-2.0 · Alpha · macOS and Windows</div>
<div class="shot"><img src="../exploration-press-enter-paper.png" alt=""></div>
</body></html>
