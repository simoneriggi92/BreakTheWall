<!doctype html>
<!-- The 1280 × 640 social preview, rendered by `npm run brand` to .github/assets/social-preview.png. -->
<html lang="en"><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #0f2c4f; color: #e9f1f9; font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(173, 196, 215, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(173, 196, 215, .08) 1px, transparent 1px); background-size: 24px 24px; }
.text { position: absolute; left: 64px; top: 70px; width: 540px; }
.text img { width: 470px; display: block; }
h1 { font-size: 30px; line-height: 1.3; font-weight: 600; margin: 38px 0 18px; }
.loop { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 21px; color: #adc4d7; letter-spacing: .03em; }
.loop b { color: #d96b4b; font-weight: 600; }
.facts { position: absolute; left: 64px; bottom: 56px; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; color: #b2c6db; letter-spacing: .08em; text-transform: uppercase; }
.shot { position: absolute; right: -60px; top: 70px; width: 680px; height: 500px; border: 1px solid #3a6290; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
.shot img { width: 100%; display: block; }
</style></head><body><div class="grid"></div>
<div class="text">
  <img src="wordmark-blueprint.svg" alt="Break the Wall: take the text apart.">
  <h1>AI gives you a wall of text. Take it apart into source-linked parts you can explore, test and put back together.</h1>
  <div class="loop">disassemble <b>→</b> run <b>→</b> reassemble</div>
</div>
<div class="facts">Open source · Apache-2.0 · Alpha · macOS</div>
<div class="shot"><img src="../disassembly-mill-blueprint.png" alt=""></div>
</body></html>
