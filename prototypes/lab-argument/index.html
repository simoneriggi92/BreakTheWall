.pts .mk { color: var(--muted); font-weight: 700; text-align: center; } .pts .m-caveat .mk { color: #b5651d; } .pts .m-keeps .mk { color: #2c4f75; }

/* faces of a sub-part: drawers, dials, holders */

.fmt h2, .fmt h3, .fmt h4, .fmt h5 { margin: 12px 0 4px; line-height: 1.25; } .fmt h2 { font-size: 1.3em; } .fmt h3 { font-size: 1.12em; } .fmt h4 { font-size: 1em; } .fmt h5 { font-size: .95em; }
.fmt p { margin: 3px 0 8px; } .fmt ul, .fmt ol { margin: 2px 0 8px; padding-left: 20px; } .fmt li { margin: 2px 0; }
.fmt table { border-collapse: collapse; font-size: .88em; margin: 4px 0 10px; } .fmt th, .fmt td { border-bottom: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; } .fmt th { font-weight: 600; background: #f4f1ea; }
.fmt pre { margin: 4px 0 10px; padding: 8px 10px; background: #f4f1ea; border-radius: 6px; font: .84em/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; } .fmt pre span { display: block; }

.fmt .blk:has(.hit) { box-shadow: inset 3px 0 0 var(--coral); }
.cable.sup { stroke: #e5533d; stroke-width: 3; } .cable.att { stroke: #d08a22; stroke-width: 3; } .cable.lim { stroke: #5d6772; stroke-width: 2.6; }

.part.lifted { pointer-events: none; }

<script>
'use strict';
const D = window.DISASSEMBLIES.mill;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ===== 1. From the disassembly =====
const parts = {}, parent = {}, joints = [];
(function walk(ps, par) { for (const p of ps) { parts[p.id] = p; parent[p.id] = par; if (p.parts) walk(p.parts, p.id); for (const j of p.joints || []) joints.push({ ...j, level: p.id }); } })(D.parts, null);
for (const j of D.joints) joints.push({ ...j, level: null });
const TOP = D.parts.map(p => p.id);
const topOf = id => parent[id] ? topOf(parent[id]) : id;
const SOURCES = [...D.sources].sort((a, b) => a.title.localeCompare(b.title));
const srcOf = id => D.sources.find(s => s.id === id);
const overlaps = (a, b) => a.some(x => b.some(y => x.source === y.source && x.from <= y.to && y.from <= x.to));
const rangeTxt = cs => cs.map(c => `${srcOf(c.source).title} ${c.from === c.to ? c.from : `${c.from}–${c.to}`}`).join(', ');
const jkey = j => j.from + '>' + j.to;

// The path: one step per section, across both pages; headings inside code blocks are not sections.
const STEPS = (() => {
  const out = [];
  for (const s of SOURCES) {
    const L = s.text.split('\n'); let fence = false; const heads = [];
    L.forEach((l, i) => { if (/^\s*```/.test(l)) fence = !fence; else if (!fence && /^#{1,2} /.test(l)) heads.push({ source: s.id, from: i + 1, title: l.replace(/^#+\s*/, '') }); });
    heads.forEach((h, k) => { h.to = k + 1 < heads.length ? heads[k + 1].from - 1 : L.length; });
    // a source with fewer than three sections is read by paragraph: each run of non-blank lines is a step
    if (heads.length >= 3) { out.push(...heads); continue; }
    let st = null; const blocks = [];
    L.forEach((l, i) => { if (l.trim()) { if (!st) st = { source: s.id, from: i + 1 }; st.to = i + 1; } else if (st) { blocks.push(st); st = null; } }); if (st) blocks.push(st);
    blocks.forEach(b => { const w = L[b.from - 1].replace(/^#+\s*/, '').split(/\s+/); b.title = w.slice(0, 7).join(' ') + (w.length > 7 ? '…' : ''); out.push(b); });
  }
  const seen = new Set();

  const mine = sel.filter(c => c.source === src);
  $('#dockr').textContent = mine.length ? `${f.name} · righe ${mine.map(c => `${c.from}–${c.to}`).join(', ')}${exploring() ? ` · lettura al passo ${s.k + 1}` : ''}` : `Passo ${s.k + 1} · ${s.title} · righe ${s.from}–${s.to}`;
  const inP = n => s.source === src && n >= s.from && n <= s.to, hit = n => mine.some(c => n >= c.from && n <= c.to);
  for (const e of $('#lines').querySelectorAll('[data-n]')) { const n = +e.dataset.n, h = hit(n); e.classList.toggle('hit', h); e.classList.toggle('pass', !h && inP(n)); }
  if (scroll) scrollToLine(mine[0]?.from || (s.source === src ? s.from : 1));
}
function scrollToLine(n) {
  const box = $('#lines'); let el = null;
  for (const e of box.querySelectorAll('[data-n]')) if (+e.dataset.n >= n) { el = e; break; }
  if (el) box.scrollTop += el.getBoundingClientRect().top - box.getBoundingClientRect().top - 10;
}

// ===== 7. Interaction =====
function goStep(k) { k = Math.max(0, Math.min(STEPS.length - 1, k)); if (k === state.step) return draw(); state.arrive = k > state.step; state.step = k; if (state.open && !built(state.open)) state.open = null; if (state.sel && !built(state.sel)) { state.sel = null; state.feat = null; } if (state.joint && !jointBuilt(state.joint)) state.joint = null; draw(); }
function select(id) { state.joint = null; state.feat = null; if (state.sel === id && parts[id].parts && !state.open) return openPart(id); state.sel = id; draw(); }
function openPart(id) { if (!state.open) state.saved = { step: state.step, sel: id, scroll: $('#lines').scrollTop, src: shown }; state.open = id; state.sel = id; state.joint = null; state.feat = null; draw(); }
function back() {
  if (!state.open) { state.sel = null; state.joint = null; state.feat = null; draw(); return; }
  const s = state.saved || {};
  flip(true, () => { state.open = null; state.joint = null; state.feat = null; state.sel = s.sel ?? null; state.step = s.step ?? state.step; draw(); if (s.scroll != null && s.src === shown) $('#lines').scrollTop = s.scroll; $(`#svg [data-id="${state.sel}"]`)?.focus(); });
}
function pickFeat(key) { const f = FEAT[key]; if (!f) return; state.feat = key; state.sel = f.part; state.joint = null; draw(); $(`[data-feat="${key}"]`)?.focus({ preventScroll: true }); }
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#note') && !t.closest('.card') || t.closest('[data-act="closenote"]')) { $('#note').classList.remove('on'); return; }
  if (t.closest('#noteBtn')) { $('#note').classList.add('on'); return; }
  if (t.closest('#buildBtn')) { state.build = !state.build; if (state.sel && !built(state.sel)) state.sel = null; return draw(); }
  if (t.closest('#rawBtn')) { const top = $('#lines').scrollTop; state.raw = !state.raw; rendered = null; drawSource(!!focusOf()); if (!focusOf()) scrollToLine(STEPS[state.step].from); return; }
  const br = t.closest('[data-brick]'); if (br) { state.load = state.load === br.dataset.brick ? null : br.dataset.brick; state.predicted = null; return draw(); }
  const pr = t.closest('[data-predict]'); if (pr) { state.predicted = pr.dataset.predict; return draw(); }
  if (t.closest('[data-act="putback"]')) { state.load = null; state.predicted = null; return draw(); }
  const fp = t.closest('[data-featpick]'); if (fp) return pickFeat(fp.dataset.featpick);
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'toread') return toRead();
  if (act === 'readhere') { const k = +t.closest('[data-act]').dataset.k; state.read = null; return goStep(k); }
  const step = t.closest('[data-step]'); if (step) { if (!state.open) { state.sel = null; state.joint = null; state.feat = null; } return goStep(+step.dataset.step); }
  const pick = t.closest('[data-pick]'); if (pick) return select(pick.dataset.pick);
  const cite = t.closest('[data-cite]'); if (cite) { if (cite.dataset.src) renderSource(cite.dataset.src); scrollToLine(+cite.dataset.cite); return; }
  if (act === 'open') return openPart(state.sel);
  if (act === 'back') return back();
  if (act === 'desel') { state.sel = null; state.joint = null; state.feat = null; return draw(); }
  if (act === 'next' || act === 'prev') return goStep(state.step + (act === 'next' ? 1 : -1));
  const ft = t.closest('#svgSub [data-feat]'); if (ft) return pickFeat(ft.dataset.feat);
  const jt = t.closest('[data-joint]'); if (jt) { state.joint = jt.dataset.joint; state.feat = null; draw(); return; }
  const part = t.closest('#svg [data-id]');
  if (part && state.open) { const id = part.dataset.id; if (parts[id].parts) { if (id !== state.open) openPart(id); else { state.sel = id; state.feat = null; draw(); } } else { state.open = null; state.sel = id; state.joint = null; state.feat = null; draw(); } return; }
  if (part) return select(part.dataset.id);
  const sub = t.closest('#svgSub [data-id]'); if (sub) { state.joint = null; state.feat = null; state.sel = sub.dataset.id; return draw(); }
  if (state.open && t.closest('#upper')) return back();
  if (t.closest('#mini')) { if (state.open) back(); else { state.sel = null; state.feat = null; draw(); } return; }
  if (t.closest('#back')) return back();
});
document.addEventListener('dblclick', e => { const p = e.target.closest('#svg [data-id]'); if (p && parts[p.dataset.id].parts) openPart(p.dataset.id); });
document.addEventListener('keydown', e => {
  if ($('#note').classList.contains('on')) { if (e.key === 'Escape') $('#note').classList.remove('on'); return; }
  const ft = e.target.closest?.('#svgSub [data-feat]');
  if ((e.key === 'Enter' || e.key === ' ') && ft) { e.preventDefault(); pickFeat(ft.dataset.feat); return; }
  const p = e.target.closest?.('#svg [data-id], #svgSub [data-id]');
  if ((e.key === 'Enter' || e.key === ' ') && p) { e.preventDefault(); const id = p.dataset.id; const inUpper = !!p.closest('#svg'); if (state.sel === id && parts[id].parts && inUpper) openPart(id); else { if (inUpper && state.open && !parts[id].parts) { state.open = null; } state.sel = id; state.joint = null; state.feat = null; draw(); $(`[data-id="${id}"]`)?.focus(); } return; }
  if (e.key === 'ArrowDown' && state.sel && parts[state.sel].parts && state.open !== state.sel) { e.preventDefault(); openPart(state.sel); return; }
  if (e.key === 'Escape' || (e.key === 'ArrowUp' && state.open)) { e.preventDefault(); back(); return; }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest?.('#lines')) goStep(state.step + (e.key === 'ArrowRight' ? 1 : -1));
});
const tip = $('#tip');
document.addEventListener('mouseover', e => {
  const ft = e.target.closest('#svgSub [data-feat]'), p = !ft && e.target.closest('#svg [data-id], #svgSub [data-id]'), j = e.target.closest('#svg [data-joint], #svgSub [data-joint]');
  document.querySelectorAll('#lines .pre').forEach(x => x.classList.remove('pre'));
  if (!ft && !p && !j) { tip.style.display = 'none'; return; }
  let cites, html;
  if (ft) { const f = FEAT[ft.dataset.feat]; cites = [{ source: f.source, from: f.line, to: f.to ?? f.line }]; html = `<b>${esc(f.label)}</b>${FKIND[f.kind]} di «${esc(parts[f.part].name)}» · riga ${f.line}${f.to ? '–' + f.to : ''}`; }
  else if (p) { const q = parts[p.dataset.id]; cites = q.cites || []; html = `<b>${esc(q.name)}</b>${q.parts && p.closest('#svg') ? (state.sel === q.id ? 'Premi di nuovo o Invio per aprire' : 'Premi per sceglierlo, doppio clic per aprirlo') : 'Premi per sceglierlo'}`; }
  else { const jj = joints.find(x => jkey(x) === j.dataset.joint); cites = jj.cites || []; html = `<b>«${esc(jj.label)}»</b>${esc(parts[jj.from].name)} ${TYPE[jj.type] || '→'} ${esc(parts[jj.to].name)}`; }
  tip.innerHTML = html; tip.style.display = 'block';
  cites.filter(c => c.source === shown).forEach(c => { for (let n = c.from; n <= c.to; n++) { const l = $(`#lines [data-n="${n}"]`); if (l && !l.classList.contains('hit')) l.classList.add('pre'); } });
});
document.addEventListener('mousemove', e => { if (tip.style.display === 'block') { tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; } });
(() => {
  let y0 = null, h0 = 0;
  $('#grip').addEventListener('pointerdown', e => { y0 = e.clientY; h0 = $('#dock').getBoundingClientRect().height; e.target.setPointerCapture(e.pointerId); });
  $('#grip').addEventListener('pointermove', e => { if (y0 === null) return; const h = Math.max(110, Math.min(window.innerHeight * 0.6, h0 - (e.clientY - y0))); document.documentElement.style.setProperty('--dock', h + 'px'); });
  $('#grip').addEventListener('pointerup', () => { y0 = null; });
  let fs = 13; const setFs = d => { fs = Math.max(11, Math.min(18, fs + d)); document.documentElement.style.setProperty('--fs', fs + 'px'); };
  $('#fsm').onclick = () => setFs(-1); $('#fsp').onclick = () => setFs(1);
})();
$('#notecard').innerHTML = `<h2 style="margin-top:0">Come è costruito questo prototipo</h2>
<p>Una prova del laboratorio su un argomento, la fixture pubblica <code>mill-harm</code>: Mill, <i>On Liberty</i>, cap. I. A differenza della consolle e della centralina, qui <b>l’oggetto dell’insieme non è disegnato a mano</b>: lo compone una grammatica scritta una volta per gli argomenti, che legge soltanto i tipi dei pezzi e dei legami.</p>
<table><tr><th>Regola</th><th>Che cosa diventa</th></tr>
<tr><td>un pezzo che ne <b>sostiene</b> un altro</td><td>sta sotto, con un perno corallo: un fondamento è una platea, una premessa una colonna sul suo basamento</td></tr>
<tr><td>un pezzo sostenuto</td><td>la trave</td></tr>
<tr><td>ciò che la trave sostiene</td><td>un piano sopra la trave, con una stanza per sotto-pezzo</td></tr>
<tr><td>un pezzo che <b>limita</b></td><td>un morsetto sull’estremità, con una targhetta per sotto-pezzo</td></tr>
<tr><td>un pezzo che <b>attacca</b></td><td>un cuneo ambra sul bordo</td></tr>
<tr><td>scartato, o senza legami</td><td>un vassoio a lato</td></tr></table>
<p style="margin-top:12px"><b>Dalla biblioteca (per tipo, non per questa fonte):</b> le forme, i materiali, i testi «Nell’oggetto» e «Dove finisce l’analogia».<br>
<b>Dalla scomposizione:</b> nomi, ruoli, punti, metafore, citazioni, i legami e le loro etichette, la prova «Togli un mattone» con i suoi esiti, il percorso (un passo per paragrafo, perché la fonte ha un solo titolo).<br>
<b>Interattivo:</b> scelta, apertura con il pezzo che si solleva, ritorno al punto di lettura, «Esplori», la prova sotto carico con la previsione prima dell’esito, costruzione progressiva, fonte formattata.<br>
<b>Non c’è:</b> la ricomposizione, il caso nuovo (la seconda prova della fixture), facce dalle righe (la fonte è prosa: niente titoli, tabelle o elenchi su cui costruirle).</p>
<div class="actions"><button class="btn primary" data-act="closenote">Chiudi</button></div>`;
draw();
</script>
