<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lettura guidata · prototipo</title>
<!-- Prototype for research R-20261102-guided-reading and plan P-20261102-guided-reading G7. See README.md. -->
<style>
:root {
  --bg: #f4efe6; --paper: #fbf8f2; --ink: #1f2a33; --muted: #6b737a; --line: #d8cfbf;
  --board: #e9e2d5; --board-side: #d9d0bf; --top: #fdfaf4; --front: #e6dece; --side: #d4c9b5;
  --add: #d96b4b; --deepen: #3c6e8f; --relate: #2f7a64; --context: #8a8f94; --frame: #9a7b3c;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-rows: 48px minmax(0, 1fr) var(--band, 34vh); height: 100vh; }
header { display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--ink); color: #f4efe6; }
header b { font-size: 15px; letter-spacing: .01em; }
header .sub { color: #aab3ba; }
header .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid #4a5661; border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; color: #cfd6db; }
.seg button[aria-pressed="true"] { background: #f4efe6; color: var(--ink); }
.keys { color: #aab3ba; font-size: 12px; }
.keys kbd { font: 11px var(--mono); border: 1px solid #5a6672; border-radius: 3px; padding: 0 4px; color: #e4e9ec; }

.main { display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; min-height: 0; }
.route { border-right: 1px solid var(--line); overflow: auto; padding: 12px 10px; }
.route h2, .panel h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 6px 10px; font-weight: 600; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 6px; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px; margin-bottom: 2px; }
.step:hover { background: var(--paper); }
.step[aria-current="step"] { background: var(--paper); border-color: var(--add); }
.step .n { font: 11px var(--mono); color: var(--muted); padding-top: 2px; }
.step .t { font-size: 13px; }
.step.read .t { color: var(--muted); }
.dots { display: flex; gap: 4px; margin-top: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; }

.stage { position: relative; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.crumbs { display: flex; gap: 8px; align-items: center; padding: 10px 16px 0; color: var(--muted); font-size: 12px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--deepen); text-decoration: underline; }
.canvas { position: relative; min-height: 0; }
.canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 6px 16px 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.marginBtn { position: absolute; top: 10px; right: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 3px 12px; font-size: 12px; }
.marginBtn[aria-pressed="true"] { border-color: var(--ink); }
.marginBtn .count { display: inline-block; min-width: 16px; border-radius: 8px; background: var(--context); color: white; font-size: 11px; text-align: center; margin-left: 4px; }
.margin { position: absolute; top: 44px; right: 14px; width: 270px; max-height: calc(100% - 60px); overflow: auto; background: #f7f3eb; border: 1px dashed var(--context); border-radius: 8px; padding: 10px 12px; font-size: 13px; box-shadow: 0 6px 20px rgba(31,42,51,.08); }
.margin h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--context); }
.margin .note { border-top: 1px solid var(--line); padding: 6px 0; }
.margin .note:first-of-type { border-top: 0; }
.margin .why { font: 11px var(--mono); color: var(--muted); }

.panel { border-left: 1px solid var(--line); overflow: auto; padding: 12px 16px 20px; background: var(--paper); }
.where { font: 11px var(--mono); color: var(--muted); margin: 0 0 2px; }
.panel h1 { font-size: 20px; line-height: 1.2; margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-size: 11px; border-radius: 10px; padding: 1px 8px; color: white; }
.card { border-top: 1px solid var(--line); padding: 10px 0; }
.card .kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.card h3 { margin: 2px 0 4px; font-size: 15px; }
.card p { margin: 4px 0; }
.card ul { margin: 6px 0 0; padding-left: 18px; }
.card li { margin: 3px 0; }
.analogy { background: #f4efe6; border-radius: 6px; padding: 6px 8px; margin-top: 6px; font-size: 13px; }
.analogy .lim { color: #8a4a33; margin-top: 4px; }
.joint { font-size: 13px; margin: 4px 0; }
.joint b { font-weight: 600; }
.nav { display: flex; gap: 8px; margin-top: 14px; }
.nav button { flex: 1; border: 1px solid var(--line); background: white; border-radius: 6px; padding: 7px; }
.nav button.primary { background: var(--add); border-color: var(--add); color: white; }
.nav button:disabled { opacity: .4; cursor: default; }
.hint { color: var(--muted); font-size: 12px; margin-top: 10px; }

.band { border-top: 2px solid var(--ink); background: white; display: grid; grid-template-rows: 30px minmax(0, 1fr); min-height: 0; }
.band .bar { display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.band .bar .grow { flex: 1; }
.band input[type=range] { width: 110px; }
.src { overflow: auto; font: 12.5px/1.55 var(--mono); padding: 6px 0 40px; }
.ln { display: grid; grid-template-columns: 46px 1fr; white-space: pre-wrap; padding-right: 12px; border-left: 3px solid transparent; }
.ln .no { color: #a8aeb3; text-align: right; padding-right: 10px; user-select: none; }
.ln.cur { background: #fdf1e9; }
.ln.sel { border-left-color: var(--deepen); }
.ln.excl { color: #9aa0a5; font-style: italic; }
.ln.h { font-weight: 700; }

/* Drawing */
.ghost { opacity: .55; }
.lbl { font-size: 12px; fill: var(--ink); font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.lbl.dim { fill: var(--muted); font-weight: 500; }
.jl { font-size: 11px; }
.part { cursor: pointer; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.part.enter { animation: rise .6s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(-26px); opacity: 0; } to { transform: none; opacity: 1; } }
.pulse { animation: pulse 1.4s ease-in-out 2; }
@keyframes pulse { 50% { opacity: .35; } }
.spin { animation: spin 3s linear infinite; }
@keyframes spin { to { stroke-dashoffset: -40; } }
.pipe { fill: none; stroke-linecap: round; }
.draw { stroke-dasharray: 600; animation: draw .9s ease-out; }
@keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 1100px) { .main { grid-template-columns: 190px minmax(0, 1fr) 280px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <b>Break the Wall</b><span class="sub">Lettura guidata · prototipo</span>
    <span class="grow"></span>
    <span class="seg" role="group" aria-label="Fonte">
      <button data-fixture="importer">Importatore · meccanismo</button>
      <button data-fixture="mill">Mill · argomento</button>
    </span>
    <span class="seg" role="group" aria-label="Disegno">
      <button id="modeShapes" aria-pressed="true">Oggetto · forme funzionali</button>
      <button id="modeTiles" aria-pressed="false">Tessere · come oggi</button>
    </span>
    <span class="keys"><kbd>←</kbd><kbd>→</kbd> leggi (x) · <kbd>↓</kbd> apri (y) · <kbd>↑</kbd> torna · <kbd>Z</kbd> margine (z)</span>
  </header>
  <div class="main">
    <nav class="route" aria-label="Percorso di lettura"><h2 id="routeTitle">Percorso</h2><div id="route"></div></nav>
    <section class="stage">
      <div class="crumbs" id="crumbs"></div>
      <div class="canvas"><svg id="svg" viewBox="50 20 990 610" role="img" aria-label="Disegno dell'insieme"></svg></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--frame)"></i>inquadra</span>
        <span><i class="dot" style="background:var(--add)"></i>aggiunge</span>
        <span><i class="dot" style="background:var(--deepen)"></i>approfondisce</span>
        <span><i class="dot" style="background:var(--relate)"></i>collega</span>
        <span><i class="dot" style="background:var(--context)"></i>a margine</span>
        <span>· tratteggio = pezzo non ancora letto · ogni linea tra due pezzi è un giunto della fonte</span>
        <span id="jointLegend"></span>
      </div>
      <button class="marginBtn" id="marginBtn" aria-pressed="false">Margine (z)<span class="count" id="marginCount">0</span></button>
      <aside class="margin" id="margin" hidden></aside>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <section class="band">
    <div class="bar"><b style="color:var(--ink)">Fonte</b><span id="bandInfo"></span><span class="grow"></span>
      <label>Altezza <input type="range" id="bandH" min="18" max="55" value="34"></label></div>
    <div class="src" id="src"></div>
  </section>
</div>
<script src="data.js"></script>
<script>
'use strict';
const KEY = Object.hasOwn(window.DISASSEMBLIES, location.hash.slice(1)) ? location.hash.slice(1) : 'importer';
const D = window.DISASSEMBLIES[KEY];
const FAMILY = { 'sends-to': 'mechanism', causes: 'mechanism', 'depends-on': 'mechanism', supports: 'argument', attacks: 'argument', limits: 'argument', 'leads-to': 'story', because: 'story' };
const ARGUMENT = D.joints.filter(j => FAMILY[j.type] === 'argument').length * 2 > D.joints.length;
const src = D.sources[0];
const LINES = src.text.split('\n');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const COLOR = { frame: 'var(--frame)', add: 'var(--add)', deepen: 'var(--deepen)', relate: 'var(--relate)', context: 'var(--context)' };
const WORD = { frame: 'inquadra il tutto', add: 'aggiunge', deepen: 'approfondisce', relate: 'collega', context: 'a margine' };
const REASON = { context: 'contesto', detail: 'dettaglio', repetition: 'ripetizione', 'outside-question': 'fuori dalla domanda', secrets: 'riservato', generated: 'generato' };
const MARK = { step: '▸', keeps: '■', caveat: '⚠' };

// ---- What is computed from the disassembly: the reading route (x), what each passage does, the margin (z). ----
const lineSet = cites => { const s = new Set(); (cites || []).forEach(c => { for (let n = c.from; n <= c.to; n++) s.add(n); }); return s; };
const owner = new Map();            // line → top-level part ids that take it apart (directly or through a sub-part)
const subOwner = new Map();         // line → sub-part ids
D.parts.forEach(p => {
  lineSet(p.cites).forEach(n => owner.set(n, [...(owner.get(n) || []), p.id]));
  (p.parts || []).forEach(s => lineSet(s.cites).forEach(n => { owner.set(n, [...new Set([...(owner.get(n) || []), p.id])]); subOwner.set(n, [...(subOwner.get(n) || []), s.id]); }));
});
const wholeLines = lineSet(D.whole.cites);
const jointLines = D.joints.map(j => ({ j, lines: lineSet(j.cites) }));
const exclusions = [...D.bom.excluded, ...D.parts.flatMap(p => p.excluded || [])];

// Passages: one per heading section (Codex's route would cut long sections further, never inside a block).
const heads = LINES.map((l, i) => /^#{1,3} /.test(l) ? i + 1 : 0).filter(Boolean);
let bounds = (heads[0] > 1 ? [[1, heads[0] - 1]] : []).concat(heads.map((h, k) => [h, (heads[k + 1] || LINES.length + 1) - 1]));
// A source with almost no headings (Mill) is cut at blank lines past about 1,500 characters, never inside a paragraph.
if (heads.length < 3) bounds = bounds.flatMap(([from, to]) => {
  const out = []; let start = from, size = 0;
  for (let n = from; n <= to; n++) { size += LINES[n - 1].length + 1; if (!LINES[n - 1].trim() && size > 1500 && n < to) { out.push([start, n]); start = n + 1; size = 0; } }
  return [...out, [start, to]];
});
const seen = new Set(), drawnJoints = new Set();
const STEPS = bounds.map(([from, to]) => {
  const ns = []; for (let n = from; n <= to; n++) if (LINES[n - 1].trim()) ns.push(n);
  const tops = [...new Set(ns.flatMap(n => owner.get(n) || []))];
  const add = tops.filter(t => !seen.has(t)), deepen = tops.filter(t => seen.has(t));
  const relate = jointLines.filter(x => ns.some(n => x.lines.has(n))).map(x => x.j);
  const frame = !tops.length && ns.some(n => wholeLines.has(n));
  const margin = exclusions.filter(x => x.to >= from && x.from <= to);
  tops.forEach(t => seen.add(t));
  const cats = [frame && 'frame', add.length && 'add', deepen.length && 'deepen', relate.length && 'relate', margin.length && !tops.length && !frame && 'context'].filter(Boolean);
  const first = LINES.slice(from - 1, to).find(l => l.trim()) || '';
  const title = /^#/.test(LINES[from - 1]) ? LINES[from - 1].replace(/^#+\s*/, '').replace(/^\d+(\.\d+)*\.?\s*/, '') : first.length > 46 ? first.slice(0, 45).trim() + '…' : first || 'Inizio';
  return { from, to, title, add, deepen, relate, frame, margin, cats, subs: [...new Set(ns.flatMap(n => subOwner.get(n) || []))] };
});
const firstAdd = id => STEPS.findIndex(s => s.add.includes(id));
// A joint without citations has no passage of its own: it comes with its later end, as readingRoles does in the app.
STEPS.forEach((s, i) => s.relate.push(...D.joints.filter(j => !j.cites?.length && Math.max(firstAdd(j.from), firstAdd(j.to)) === i && firstAdd(j.from) >= 0 && firstAdd(j.to) >= 0)));
STEPS.forEach(s => { if (s.relate.length && !s.cats.includes('relate')) s.cats.push('relate'); });
const firstRelate = j => STEPS.findIndex(s => s.relate.includes(j));
const firstFrame = STEPS.findIndex(s => s.frame || s.add.length);

// ---- What is prepared by hand: where each part sits and which functional shape it takes. ----
const CONFIG = {
  importer: {
    places: { pause: [40, 24, 86, 64, 26], round: [56, 166, 176, 176, 30], heartbeat: [296, 30, 104, 72, 28], finished: [296, 166, 104, 72, 28],
      outcomes: [296, 300, 112, 92, 28], restart: [478, 24, 104, 84, 34], board: [476, 196, 140, 150, 40] },
    shapes: { round: 'cycle', heartbeat: 'register', finished: 'register', outcomes: 'tape', pause: 'switch', restart: 'comparator', board: 'gauge' },
    subShapes: { 'round-stamp': 'register', 'round-switch': 'switch', 'round-fetch': 'tape', 'round-hand': 'cycle', 'round-close': 'register' },
  },
  // An argument as a load-bearing frame: the claim is a beam, premises and grounds hold it up, a limit clamps it, an objection is a wedge.
  mill: {
    places: { 'abstract-right': [30, 30, 96, 66, 16], objection: [250, 24, 110, 76, 30], claim: [240, 166, 170, 86, 52], bounds: [470, 176, 96, 92, 30],
      sovereignty: [110, 316, 92, 80, 34], utility: [280, 330, 150, 84, 14], region: [486, 330, 140, 96, 12] },
    shapes: { claim: 'beam', sovereignty: 'pillar', utility: 'foundation', 'abstract-right': 'aside', bounds: 'clamp', objection: 'wedge', region: 'field' },
    subShapes: { 'bounds-maturity': 'clamp', 'bounds-colonial': 'clamp', 'bounds-duties': 'clamp', 'region-conscience': 'field', 'region-pursuits': 'field', 'region-association': 'field' },
  },
};
const { places: PLACES, shapes: SHAPES, subShapes: SUB_SHAPES } = CONFIG[KEY];
const SHAPE_WORD = { cycle: 'ciclo', register: 'registro', tape: 'nastro', switch: 'interruttore', comparator: 'comparatore', gauge: 'quadrante',
  beam: 'trave', pillar: 'pilastro', foundation: 'fondamenta', aside: 'scarto', clamp: 'morsetto', wedge: 'cuneo', field: 'campo' };

// ---- Isometric drawing helpers (2.5D). ----
const BOARD = [0, 0, 650, 440, 12];
const pt = (x, y, z = 0) => [452 + (x - y) * 0.866, 70 + (x + y) * 0.5 - z];
const P = (...a) => pt(...a).map(v => v.toFixed(1)).join(',');
const poly = (pts, fill, extra = '') => `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="#7d756a" stroke-width=".6" stroke-linejoin="round" ${extra}/>`;
function box(x, y, z, w, d, h, c = {}) {
  const t = z + h;
  return poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x, y + d, t)], c.front || 'var(--front)')
    + poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, t), P(x + w, y, t)], c.side || 'var(--side)')
    + poly([P(x, y, t), P(x + w, y, t), P(x + w, y + d, t), P(x, y + d, t)], c.top || 'var(--top)', c.topExtra || '');
}
const ell = (cx, cy, z, r, fill, extra = '') => { const [X, Y] = pt(cx, cy, z); return `<ellipse cx="${X}" cy="${Y}" rx="${(r * 1.2247).toFixed(1)}" ry="${(r * 0.7071).toFixed(1)}" fill="${fill}" stroke="#7d756a" stroke-width=".6" ${extra}/>`; };
function cylinder(cx, cy, z, r, h, c = {}) {
  const [X, Yb] = pt(cx, cy, z), Yt = Yb - h, rx = r * 1.2247, ry = r * 0.7071;
  return `<path d="M${X - rx},${Yb} A${rx},${ry} 0 0 0 ${X + rx},${Yb} L${X + rx},${Yt} L${X - rx},${Yt} Z" fill="${c.side || 'var(--front)'}" stroke="#7d756a" stroke-width=".6"/>` + ell(cx, cy, z + h, r, c.top || 'var(--top)');
}

// Functional shapes: what the part does, said by its form. Each sits on the footprint [x, y, w, d] with height h.
function shape(kind, [x, y, w, d, h], c, sel) {
  const top = z => z + h, cx = x + w / 2, cy = y + d / 2;
  switch (kind) {
    case 'cycle': {
      const r = Math.min(w, d) / 2 - 6;
      let s = cylinder(cx, cy, 0, r, h, c) + ell(cx, cy, h, r * 0.62, '#efe8db');
      const [X, Y] = pt(cx, cy, h);
      s += `<ellipse cx="${X}" cy="${Y}" rx="${(r * .8 * 1.2247).toFixed(1)}" ry="${(r * .8 * .7071).toFixed(1)}" fill="none" stroke="${c.accent}" stroke-width="2.4" stroke-dasharray="14 6" class="spin" marker-end="url(#arrow)"/>`;
      for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; s += ell(cx + Math.cos(a) * r * .8, cy + Math.sin(a) * r * .8, h + 1, 5, c.accent); }
      return s;
    }
    case 'register': {
      let s = box(x, y, 0, w, d, h, c) + poly([P(x + 12, y + 12, h + .5), P(x + w - 12, y + 12, h + .5), P(x + w - 12, y + d - 12, h + .5), P(x + 12, y + d - 12, h + .5)], '#27323b');
      for (let i = 0; i < 4; i++) { const sx = x + 20 + i * (w - 40) / 3.4; s += poly([P(sx, y + d / 2 - 3, h + 1), P(sx + 10, y + d / 2 - 3, h + 1), P(sx + 10, y + d / 2 + 3, h + 1), P(sx, y + d / 2 + 3, h + 1)], c.accent, 'stroke="none"'); }
      return s;
    }
    case 'tape': return box(x, y, 0, w, d, h, c) + cylinder(x + w * .3, cy, h, 18, 6, c) + ell(x + w * .3, cy, h + 6, 6, c.accent)
      + cylinder(x + w * .72, cy, h, 18, 6, c) + ell(x + w * .72, cy, h + 6, 6, c.accent)
      + `<path d="M${pt(x + w * .3, cy + 18, h + 6)} L${pt(x + w * .72, cy + 18, h + 6)}" stroke="#27323b" stroke-width="2"/>`;
    case 'switch': {
      const [bx, by] = pt(cx, cy, h + 2), tip = [bx + 16, by - 26];
      return box(x, y, 0, w, d, h, c) + box(x + w * .3, y + d * .3, h, w * .4, d * .4, 3, { top: '#27323b', front: '#27323b', side: '#27323b' })
        + `<line x1="${bx}" y1="${by}" x2="${tip[0]}" y2="${tip[1]}" stroke="#27323b" stroke-width="4" stroke-linecap="round"/><circle cx="${tip[0]}" cy="${tip[1]}" r="6" fill="${c.accent}" stroke="#27323b"/>`;
    }
    case 'comparator':
      return box(x, y, 0, w, d, h, c) + box(x + 16, y + d / 2 - 8, h, 16, 16, 30, { top: c.accent }) + box(x + w - 34, y + d / 2 - 8, h, 16, 16, 16, { top: '#efe8db' })
        + `<line x1="${pt(x + 24, y + d / 2, h + 30)[0]}" y1="${pt(x + 24, y + d / 2, h + 30)[1]}" x2="${pt(x + w - 26, y + d / 2, h + 16)[0]}" y2="${pt(x + w - 26, y + d / 2, h + 16)[1]}" stroke="#27323b" stroke-width="2" stroke-dasharray="3 3"/>`;
    case 'gauge': {
      let s = box(x, y, 0, w, d, h, c) + ell(cx - 6, cy - 6, h + .5, Math.min(w, d) * .3, '#fdfaf4');
      const [X, Y] = pt(cx - 6, cy - 6, h + 1);
      for (let i = 0; i < 7; i++) { const a = Math.PI * (1.1 + i * .13); s += `<line x1="${X + Math.cos(a) * 30}" y1="${Y + Math.sin(a) * 17}" x2="${X + Math.cos(a) * 38}" y2="${Y + Math.sin(a) * 21}" stroke="#27323b" stroke-width="1.4"/>`; }
      s += `<line x1="${X}" y1="${Y}" x2="${X + 26}" y2="${Y - 14}" stroke="${c.accent}" stroke-width="3" stroke-linecap="round"/>`;
      ['#3c9a63', '#d9a13b', '#c8553d'].forEach((col, i) => { s += ell(x + w - 22, y + 24 + i * 34, h + 1, 7, col); });
      return s;
    }
    // The argument family: what holds up, what limits, what pushes against, what is set aside.
    case 'beam': return box(x, y, 0, w, d, h, c) + box(x - 8, y + d * .2, h, w + 16, d * .6, 10, { top: c.accent, front: 'var(--front)', side: 'var(--side)' });
    case 'pillar': return box(x, y, 0, w, d, 8, c) + cylinder(cx, cy, 8, Math.min(w, d) / 2 - 12, h + 26, c) + ell(cx, cy, h + 34, Math.min(w, d) / 2 - 12, c.accent);
    case 'foundation': {
      let s = box(x, y, 0, w, d, h, c);
      for (let i = 1; i < 4; i++) s += `<path d="M${pt(x + i * w / 4, y, h)} L${pt(x + i * w / 4, y + d, h)}" stroke="#9c9384" stroke-width="1"/>`;
      return s + `<path d="M${pt(x, cy, h)} L${pt(x + w, cy, h)}" stroke="#9c9384" stroke-width="1"/>`;
    }
    case 'aside': return box(x, y, 0, w, d, h, { top: '#e7e2d9', front: '#d9d3c8', side: '#cfc8bb' })
      + `<path d="M${pt(x + 18, y + 14, h)} L${pt(x + w - 18, y + d - 14, h)} M${pt(x + w - 18, y + 14, h)} L${pt(x + 18, y + d - 14, h)}" stroke="#8a8f94" stroke-width="2.4"/>`;
    case 'clamp': return box(x, y, 0, w, d, 10, c) + box(x + 10, y + 10, 10, 14, d - 20, h + 18, c) + box(x + w - 24, y + 10, 10, 14, d - 20, h + 18, c)
      + box(x + 10, y + 10, h + 28, w - 20, d - 20, 8, { top: c.accent });
    case 'wedge': {
      const a = P(x, y + d, 0), b = P(x + w, y + d, 0), e = P(x + w, y, 0), f = P(x, y, 0), top1 = P(x, y + d / 2, h + 14), top2 = P(x + w, y + d / 2, h + 14);
      return poly([a, b, top2, top1], 'var(--front)') + poly([b, e, top2], 'var(--side)') + poly([f, e, top2, top1], c.accent === '#a39a8a' ? 'var(--top)' : c.top) + `<path d="M${top1} L${top2}" stroke="${c.accent}" stroke-width="2.4"/>`;
    }
    case 'field': {
      let s = box(x, y, 0, w, d, h, { ...c, top: '#e3ecd9' });
      [[.25, .3], [.6, .25], [.45, .7]].forEach(([u, v]) => { s += cylinder(x + w * u, y + d * v, h, 7, 12, c) + ell(x + w * u, y + d * v, h + 12, 7, c.accent); });
      return s;
    }
    default: return box(x, y, 0, w, d, h, c);
  }
}

// ---- State. ----
const S = { step: 0, mode: 'shapes', open: null, sel: null, margin: false, lastStep: -1, suspended: new Set() };
// What a suspended premise does to the frame: its supports break; a part held up only by suspended supports is "not derived here".
// The contract does not say whether supports hold jointly or one at a time, so one suspended support out of two only reduces.
function support(id) {
  const into = D.joints.filter(j => j.to === id && j.type === 'supports');
  const off = into.filter(j => S.suspended.has(j.from)).length;
  return !into.length || !off ? null : off === into.length ? 'none' : `${off} di ${into.length}`;
}

function tile([x, y, w, d, h], c) { return box(x, y, 0, w, d, Math.min(h, 14), c); }
function ghost([x, y, w, d]) { return poly([P(x, y, BOARD[4]), P(x + w, y, BOARD[4]), P(x + w, y + d, BOARD[4]), P(x, y + d, BOARD[4])], 'none', 'stroke-dasharray="5 4" stroke="#9c9384" stroke-width="1.2"'); }
const clip = ([x, y, w, d], a, b) => { // where the segment a→b leaves the rectangle (model space)
  let t = 1; const dx = b[0] - a[0], dy = b[1] - a[1];
  [[x, 'x'], [x + w, 'x'], [y, 'y'], [y + d, 'y']].forEach(([v, ax]) => { const k = ax === 'x' ? (v - a[0]) / dx : (v - a[1]) / dy; if (k > 0 && k < t) { const o = ax === 'x' ? a[1] + k * dy : a[0] + k * dx; if (ax === 'x' ? o >= y && o <= y + d : o >= x && o <= x + w) t = k; } });
  return [a[0] + dx * t, a[1] + dy * t];
};
const center = ([x, y, w, d]) => [x + w / 2, y + d / 2];
// Every line between two parts is a joint, drawn by its kind: an arrow sends, a strut holds up, a wedge pushes against, a bar limits.
function pipe(fromRect, toRect, label, color, fresh, type = 'sends-to', key = '', broken = false, z = BOARD[4]) {
  const a0 = center(fromRect), b0 = center(toRect), a = clip(fromRect, b0, a0), b = clip(toRect, a0, b0);
  const [X1, Y1] = pt(...a, z), [X2, Y2] = pt(...b, z), mx = (X1 + X2) / 2, my = (Y1 + Y2) / 2;
  const len = Math.hypot(X2 - X1, Y2 - Y1) || 1, nx = -(Y2 - Y1) / len, ny = (X2 - X1) / len;
  const w = fresh ? 3.2 : 2, cls = `pipe ${fresh ? 'draw' : ''}`;
  let s;
  if (type === 'supports') {
    const seg = (o, f0, f1) => `<path d="M${X1 + (X2 - X1) * f0 + nx * o},${Y1 + (Y2 - Y1) * f0 + ny * o} L${X1 + (X2 - X1) * f1 + nx * o},${Y1 + (Y2 - Y1) * f1 + ny * o}" class="${cls}" stroke="${broken ? '#b3261e' : color}" stroke-width="${w}"/>`;
    s = broken ? seg(3, 0, .38) + seg(-3, 0, .38) + seg(3, .62, 1) + seg(-3, .62, 1) : seg(3, 0, 1) + seg(-3, 0, 1);
    s += `<path d="M${X2 + nx * 7},${Y2 + ny * 7} L${X2 - nx * 7},${Y2 - ny * 7}" stroke="${broken ? '#b3261e' : color}" stroke-width="3"/>`;
  } else if (type === 'attacks') {
    s = `<path d="M${X1},${Y1} L${X2},${Y2}" class="${cls}" stroke="#b3261e" stroke-width="${w}" stroke-dasharray="7 5" marker-end="url(#wedge)"/>`;
  } else if (type === 'limits') {
    s = `<path d="M${X1},${Y1} L${X2},${Y2}" class="${cls}" stroke="${color}" stroke-width="${w}" stroke-dasharray="2 4"/><path d="M${X2 + nx * 9},${Y2 + ny * 9} L${X2 - nx * 9},${Y2 - ny * 9}" stroke="${color}" stroke-width="3.4"/>`;
  } else {
    s = `<path d="M${X1},${Y1} L${X2},${Y2}" class="${cls}" stroke="${color}" stroke-width="${w}" ${type === 'depends-on' ? 'stroke-dasharray="3 4"' : ''} marker-end="url(#arrow-${fresh ? 'on' : 'off'})"/>`;
  }
  return `<g data-joint="${esc(key)}">${s}<text x="${mx}" y="${my - 6}" text-anchor="middle" class="lbl jl" style="fill:${broken ? '#b3261e' : type === 'attacks' ? '#b3261e' : color}">${esc(broken ? 'sostegno sospeso' : label)}</text></g>`;
}

function render() {
  const st = STEPS[S.step], k = S.step;
  // Route (x)
  $('routeTitle').textContent = `Percorso · ${k + 1} di ${STEPS.length}`;
  $('route').innerHTML = STEPS.map((s, i) => `<button class="step ${i < k ? 'read' : ''}" data-i="${i}" ${i === k ? 'aria-current="step"' : ''}>
    <span class="n">${String(i + 1).padStart(2, '0')}</span><span><span class="t">${esc(s.title)}</span>
    <span class="dots">${s.cats.map(c => `<i class="dot" title="${WORD[c]}" style="background:${COLOR[c]}"></i>`).join('')}</span></span></button>`).join('');
  $('route').querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });

  // Crumbs (y)
  const openPart = S.open && D.parts.find(p => p.id === S.open);
  $('crumbs').innerHTML = openPart ? `<button id="back">${esc(D.whole.name)}</button> › <b>${esc(openPart.name)}</b> <span>· sotto-assieme aperto (y)</span>` : `<b>${esc(D.whole.name)}</b> <span>· l'insieme</span>`;
  $('back')?.addEventListener('click', () => { S.open = null; render(); });

  // Drawing
  const svg = [`<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--add)"/></marker>
    <marker id="arrow-on" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--relate)"/></marker>
    <marker id="arrow-off" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8a86"/></marker>
    <marker id="wedge" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L12,6 L0,12 L4,6 z" fill="#b3261e"/></marker></defs>`];
  const framed = k >= firstFrame;
  svg.push(`<g class="${framed ? '' : 'ghost'}">${box(...BOARD.slice(0, 2), 0, BOARD[2], BOARD[3], BOARD[4], { top: framed ? 'var(--board)' : 'none', front: 'var(--board-side)', side: 'var(--board-side)', topExtra: st.frame ? 'stroke="var(--frame)" stroke-width="3"' : '' })}</g>`);
  const [wx, wy] = pt(0, 0, BOARD[4]);
  svg.push(`<text x="${wx - 4}" y="${wy - 12}" text-anchor="middle" class="lbl ${framed ? '' : 'dim'}">${framed ? esc(D.whole.name) : 'L’insieme, ancora da leggere'}</text>`);

  if (!openPart) {
    // Joints first, on the board: parts cover their ends.
    D.joints.forEach(j => {
      const at = firstRelate(j); if (at < 0 || at > k) return;
      svg.push(pipe(PLACES[j.from], PLACES[j.to], j.label, at === k ? 'var(--relate)' : '#7d8a86', at === k, j.type, `${j.from}>${j.to}`, j.type === 'supports' && S.suspended.has(j.from)));
    });
    const order = Object.keys(PLACES).sort((a, b) => (PLACES[a][0] + PLACES[a][1]) - (PLACES[b][0] + PLACES[b][1]));
    order.forEach(id => {
      const p = D.parts.find(x => x.id === id), at = firstAdd(id), r = PLACES[id];
      if (at < 0 || at > k) { svg.push(ghost(r)); return; }
      const now = st.add.includes(id) ? 'add' : st.deepen.includes(id) ? 'deepen' : null;
      const accent = now === 'add' ? 'var(--add)' : now === 'deepen' ? 'var(--deepen)' : '#a39a8a';
      const c = { accent, top: now === 'add' ? '#fbe5dc' : now === 'deepen' ? '#e1ebf2' : 'var(--top)' };
      const body = S.mode === 'shapes' ? shape(SHAPES[id], r, c) : tile(r, { ...c, top: now ? c.top : 'var(--top)' });
      const sel = S.sel === id ? `<g opacity=".9">${poly([P(r[0] - 6, r[1] - 6, BOARD[4]), P(r[0] + r[2] + 6, r[1] - 6, BOARD[4]), P(r[0] + r[2] + 6, r[1] + r[3] + 6, BOARD[4]), P(r[0] - 6, r[1] + r[3] + 6, BOARD[4])], 'none', 'stroke="var(--deepen)" stroke-width="2.5"')}</g>` : '';
      const [lx, ly] = pt(r[0] + r[2] / 2, r[1] + r[3] / 2, (S.mode === 'shapes' ? r[4] : 14) + 34);
      const fresh = at === k && S.lastStep !== k;
      svg.push(`<g class="part ${fresh ? 'enter' : ''} ${now === 'deepen' ? 'pulse' : ''}" data-part="${id}" tabindex="0" role="button" aria-label="${esc(p.name)}">${sel}<g transform="translate(0,-${BOARD[4]})">${body}</g>
        <text x="${lx}" y="${ly}" text-anchor="middle" class="lbl">${esc(p.name)}</text>
        ${support(id) ? `<text x="${lx}" y="${ly + 15}" text-anchor="middle" class="lbl" style="fill:#b3261e">${support(id) === 'none' ? 'non derivata qui' : `sostegno ridotto: ${support(id)} sospesi`}</text>` : ''}
        ${S.suspended.has(id) ? `<text x="${lx}" y="${ly + 15}" text-anchor="middle" class="lbl" style="fill:#b3261e">sospesa (prova)</text>` : ''}
        ${S.mode === 'tiles' ? `<text x="${lx}" y="${ly + 14}" text-anchor="middle" class="lbl dim" style="font-size:10px">${esc(p.icon)}</text>` : ''}</g>`);
    });
  } else {
    // y: the part's sub-assembly explodes in place; the rest of the object steps back.
    const subs = openPart.parts || [];
    const cx = 325, cy = 220;
    svg.push(`<g opacity=".25" transform="translate(0,-60)">${S.mode === 'shapes' ? shape(SHAPES[openPart.id], [cx - 70, cy - 70, 140, 140, 24], { accent: '#a39a8a' }) : tile([cx - 70, cy - 70, 140, 140, 14], {})}</g>`);
    const rects = Object.fromEntries(subs.map((s, i) => { const a = -Math.PI * .8 + i * (Math.PI * 1.6) / Math.max(1, subs.length - 1); return [s.id, [cx + Math.cos(a) * 230 - 42, cy + Math.sin(a) * 160 - 32, 84, 64, 22]]; }));
    (openPart.joints || []).forEach(j => svg.push(pipe(rects[j.from], rects[j.to], j.label, 'var(--relate)', false, j.type, `${j.from}>${j.to}`)));
    subs.forEach(s => {
      const r = rects[s.id], hit = st.subs.includes(s.id);
      const c = { accent: hit ? 'var(--add)' : '#a39a8a', top: hit ? '#fbe5dc' : 'var(--top)' };
      const [lx, ly] = pt(r[0] + r[2] / 2, r[1] + r[3] / 2, r[4] + 34);
      svg.push(`<g class="part enter"><g transform="translate(0,-${BOARD[4]})">${S.mode === 'shapes' ? shape(SUB_SHAPES[s.id] || 'register', r, c) : tile(r, c)}</g><text x="${lx}" y="${ly}" text-anchor="middle" class="lbl">${esc(s.name)}</text></g>`);
    });
    if (!subs.length) svg.push(`<text x="500" y="300" text-anchor="middle" class="lbl dim">Nessun sotto-assieme: nel prodotto, «Smonta più a fondo» lo genera</text>`);
  }
  $('svg').innerHTML = svg.join('');
  $('svg').querySelectorAll('[data-part]').forEach(g => {
    g.addEventListener('click', () => { S.sel = g.dataset.part; render(); });
    g.addEventListener('dblclick', () => { S.sel = g.dataset.part; openSel(); });
  });

  // Panel
  const part = id => D.parts.find(p => p.id === id);
  const later = id => firstAdd(id) > k ? ` <span class="where">(lo leggerai al passo ${firstAdd(id) + 1})</span>` : '';
  const joint = j => `<p class="joint"><b>${esc(part(j.from).name)}</b>${later(j.from)} —<span style="color:var(--relate)">${esc(j.label)}</span>→ <b>${esc(part(j.to).name)}</b>${later(j.to)} <span class="where">${j.type}</span></p>`;
  const analogy = p => p.metaphor ? `<div class="analogy">Analogia: ${esc(p.metaphor.text)}<div class="lim">⚠ Dove smette di funzionare: ${esc(p.metaphor.limit)}</div></div>` : '';
  const cards = [];
  if (st.frame) cards.push(`<div class="card"><div class="kind" style="color:var(--frame)">Inquadra il tutto</div><h3>${esc(D.whole.name)}</h3><p>${esc(D.whole.does)}</p><p style="color:var(--muted)">${esc(D.whole.why)}</p></div>`);
  st.add.forEach(id => { const p = part(id); cards.push(`<div class="card"><div class="kind" style="color:var(--add)">Aggiunge un pezzo · ${S.mode === 'shapes' ? SHAPE_WORD[SHAPES[id]] : p.kind}</div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p>${analogy(p)}${(p.parts || []).length ? `<p class="hint">Ha ${p.parts.length} pezzi dentro: <kbd>↓</kbd> per aprirlo.</p>` : ''}</div>`); });
  st.deepen.forEach(id => { const p = part(id); cards.push(`<div class="card"><div class="kind" style="color:var(--deepen)">Torna su un pezzo già letto</div><h3>${esc(p.name)}</h3><ul>${p.points.map(x => `<li>${MARK[x.mark] || '·'} ${esc(x.text)}</li>`).join('')}</ul></div>`); });
  if (st.relate.length) cards.push(`<div class="card"><div class="kind" style="color:var(--relate)">Collega</div>${st.relate.map(joint).join('')}</div>`);
  if (!cards.length) cards.push(`<div class="card"><div class="kind" style="color:var(--context)">A margine</div><p>Questo passaggio non aggiunge nulla all'oggetto. Le sue note sono nel margine (<kbd>Z</kbd>).</p></div>`);
  const holds = id => D.joints.some(j => j.from === id && j.type === 'supports') && firstAdd(id) <= k;
  const candidate = [S.sel, ...st.add, ...st.deepen].find(id => id && holds(id));
  if (ARGUMENT && candidate) {
    const p = part(candidate), on = S.suspended.has(candidate);
    cards.push(`<div class="card"><div class="kind" style="color:#b3261e">Metti alla prova il telaio</div><p>${on ? 'Sospesa' : 'Sospendi'} «${esc(p.name)}»: ciò che regge resta al suo posto, senza questo sostegno.</p>
      <button id="suspend" style="border:1px solid #b3261e;background:${on ? '#b3261e' : 'white'};color:${on ? 'white' : '#b3261e'};border-radius:6px;padding:5px 10px">${on ? 'Rimetti il sostegno' : 'Sospendi questo sostegno'}</button>
      <p class="hint">Sospendere non dimostra che la tesi sia falsa: dice solo che qui non deriva più da questo sostegno. La fonte non dice se i sostegni valgono insieme o uno alla volta: con uno su due sospeso il sostegno è «ridotto», non caduto.</p></div>`);
  }
  if (S.sel && !st.add.includes(S.sel) && !st.deepen.includes(S.sel)) { const p = part(S.sel); cards.push(`<div class="card"><div class="kind" style="color:var(--muted)">Selezionato</div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p>${analogy(p)}</div>`); }
  $('panel').innerHTML = `<p class="where">Passo ${k + 1} di ${STEPS.length} · righe ${st.from}–${st.to}</p><h1>${esc(st.title)}</h1>
    <div class="chips">${st.cats.map(c => `<span class="chip" style="background:${COLOR[c]}">${WORD[c]}</span>`).join('')}</div>${cards.join('')}
    <div class="nav"><button id="prev" ${k === 0 ? 'disabled' : ''}>← Indietro</button><button class="primary" id="next" ${k === STEPS.length - 1 ? 'disabled' : ''}>Avanti →</button></div>
    <p class="hint">Il disegno cambia solo con ciò che il passaggio fa. Un pezzo tratteggiato non è ancora stato letto.</p>`;
  $('prev').onclick = () => go(k - 1); $('next').onclick = () => go(k + 1);
  const suspend = $('suspend'); if (suspend) suspend.onclick = () => { const id = candidate; S.suspended.has(id) ? S.suspended.delete(id) : S.suspended.add(id); render(); };

  // Margin (z)
  const notes = st.margin;
  $('marginCount').textContent = notes.length;
  $('marginCount').style.background = notes.length ? 'var(--context)' : '#c3c6c9';
  $('marginBtn').setAttribute('aria-pressed', S.margin);
  $('margin').hidden = !S.margin;
  $('margin').innerHTML = `<h3>Margine · questo passaggio</h3>` + (notes.length ? notes.map(x => `<div class="note"><div class="why">${REASON[x.reason] || x.reason} · righe ${x.from}–${x.to}</div>${esc(x.note || '')}</div>`).join('') : `<div class="note" style="color:var(--muted)">Niente a margine qui. Il margine non si collega mai all'oggetto.</div>`);

  // Source band
  const selLines = S.sel ? lineSet([...part(S.sel).cites, ...(part(S.sel).parts || []).flatMap(s => s.cites)]) : new Set();
  const excl = lineSet(exclusions);
  $('src').innerHTML = LINES.map((l, i) => { const n = i + 1; return `<div class="ln ${n >= st.from && n <= st.to ? 'cur' : ''} ${selLines.has(n) ? 'sel' : ''} ${excl.has(n) ? 'excl' : ''} ${/^#/.test(l) ? 'h' : ''}" id="L${n}"><span class="no">${n}</span><span>${esc(l) || ' '}</span></div>`; }).join('');
  $('bandInfo').textContent = `${src.title} · righe ${st.from}–${st.to} di ${LINES.length}${S.sel ? ` · bordo blu: righe di «${part(S.sel).name}»` : ''}`;
  if (S.lastStep !== k) { const el = $('L' + st.from); if (el) $('src').scrollTop = el.offsetTop - $('src').offsetTop - 6; }
  S.lastStep = k;
}

function go(i) { if (i < 0 || i >= STEPS.length) return; S.step = i; S.open = null; const st = STEPS[i]; S.sel = st.add[0] || st.deepen[0] || null; render(); }
function openSel() { const id = S.sel || STEPS[S.step].add[0] || STEPS[S.step].deepen[0]; if (!id || firstAdd(id) > S.step) return; S.sel = id; S.open = id; render(); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(S.step + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(S.step - 1); }
  else if (e.key === 'ArrowDown' || (e.key === 'Enter' && !S.open)) { e.preventDefault(); openSel(); }
  else if (e.key === 'ArrowUp' || e.key === 'Escape') { e.preventDefault(); S.open = null; render(); }
  else if (e.key === 'z' || e.key === 'Z') { S.margin = !S.margin; render(); }
});
$('route').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); });
$('marginBtn').onclick = () => { S.margin = !S.margin; render(); };
const setMode = m => { S.mode = m; $('modeShapes').setAttribute('aria-pressed', m === 'shapes'); $('modeTiles').setAttribute('aria-pressed', m === 'tiles'); render(); };
$('modeShapes').onclick = () => setMode('shapes'); $('modeTiles').onclick = () => setMode('tiles');
$('bandH').oninput = e => document.getElementById('app').style.setProperty('--band', e.target.value + 'vh');
document.querySelectorAll('[data-fixture]').forEach(b => {
  b.setAttribute('aria-pressed', b.dataset.fixture === KEY);
  b.onclick = () => { location.hash = b.dataset.fixture; location.reload(); };
});
$('jointLegend').textContent = ARGUMENT ? '· puntone = sostiene · cuneo rosso = attacca · barra = limita' : '· freccia = invia · puntini = dipende da';
/** For checks: every line drawn between parts, against the joints of the fixture at the level shown. */
window.__check = () => {
  const level = S.open ? D.parts.find(p => p.id === S.open).joints || [] : D.joints;
  const drawn = [...document.querySelectorAll('#svg [data-joint]')].map(g => g.dataset.joint), known = new Set(level.map(j => `${j.from}>${j.to}`));
  return { fixture: KEY, step: S.step + 1, steps: STEPS.length, drawn, unknown: drawn.filter(x => !known.has(x)) };
};
go(0);
</script>
