<!doctype html>
<!-- PROTOTYPE, throwaway (issue #73). Three side chats anchored to one question of a round, switched with ?variant=A|B|C.
     Built on variant B ("Indice + lettore") of prototypes/round (issue #78). Replies are mocked: no agent, no fork, state in memory only. Never merged. -->
<html lang="it" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat laterale · prototipo</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js"></script>
<style>
/* Tokens copied from src/renderer/styles.css (paper and blueprint). */
:root, :root[data-theme="paper"] {
  --bg:#f4f0e6; --surface:#fbf8f1; --sunk:#ece6d8; --ink:#1d2733; --muted:#4c5866; --line:#cdc4b1;
  --accent:#1f5f99; --accent-soft:#e1e7ee; --accent-ink:#fff; --amber:#8a5a0f; --amber-soft:#f3e6cc;
  --good:#2d6e45; --good-soft:#dfeadc; --bad:#a8261e; --bad-soft:#f5ddd7; --violet:#5b3f8f; --violet-soft:#e8e1f1;
  --grid:rgba(29,39,51,.055); --shadow:rgba(29,39,51,.12); --hl:rgba(138,90,15,.22); --hl-chat:rgba(91,63,143,.20);
  color-scheme: light;
}
:root[data-theme="blueprint"] {
  --bg:#0f2c4f; --surface:#13365f; --sunk:#0c2542; --ink:#e9f1f9; --muted:#b2c6db; --line:#3a6290;
  --accent:#8ec5ff; --accent-soft:#1c4775; --accent-ink:#0b2340; --amber:#ffd27d; --amber-soft:#3a3a2c;
  --good:#9fe2b4; --good-soft:#17453c; --bad:#ff9a91; --bad-soft:#4a2a3c; --violet:#d2b8ff; --violet-soft:#33305a;
  --grid:rgba(233,241,249,.06); --shadow:rgba(0,0,0,.35); --hl:rgba(255,210,125,.28); --hl-chat:rgba(210,184,255,.25);
  color-scheme: dark;
}
:root { --f-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; --f-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --measure:66ch; --top:58px; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--f-body); -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px; }
button, textarea, input { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
code { font-family:var(--f-mono); font-size:.88em; background:var(--sunk); padding:1px 5px; border-radius:5px; }
h1,h2,h3,p { margin:0; }
::highlight(btw-annot) { background-color:var(--hl); text-decoration:underline 2px var(--amber); }
::highlight(btw-chat) { background-color:var(--hl-chat); text-decoration:underline 2px var(--violet); }

.top { position:sticky; top:0; z-index:20; height:var(--top); display:flex; align-items:center; gap:14px; padding:0 18px; background:var(--bg); border-bottom:1px solid var(--line); }
.top .title { display:flex; flex-direction:column; line-height:1.25; min-width:0; flex:1; }
.top .title small { font-size:12px; color:var(--muted); }
.top .title strong { font-family:var(--f-display); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.proto-tag { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1px dashed var(--amber); color:var(--amber); border-radius:6px; padding:3px 8px; white-space:nowrap; }
.count { font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.count b { color:var(--ink); }
.ghost { background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:6px 12px; font-size:14px; white-space:nowrap; }
.ghost:hover { border-color:var(--ink); }
.ghost.sm { padding:3px 9px; font-size:12.5px; border-radius:7px; }
.primary { background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent); border-radius:9px; padding:7px 14px; font-weight:700; font-size:14px; white-space:nowrap; }
.linkish { background:none; border:0; padding:2px 0; color:var(--accent); font-weight:700; font-size:13.5px; }
.kbd { font:11px var(--f-mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--muted); }
.hint { font-size:12.5px; color:var(--muted); }
.lbl-sm { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }

/* ---- the block (from prototypes/round, variant B) ---- */
.block { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px 28px 20px; box-shadow:0 0 0 3px var(--accent-soft), 0 10px 30px var(--shadow); border-color:var(--accent); }
.block.chatting { border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-soft), 0 10px 30px var(--shadow); }
.block .qid { font:700 12px var(--f-mono); color:var(--accent); letter-spacing:.06em; }
.block h2 { font-family:var(--f-display); font-size:21px; line-height:1.3; margin:4px 0 14px; max-width:var(--measure); }
.bhead { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.body { max-width:var(--measure); font-size:15.5px; }
.body p { margin:0 0 12px; }
.body .lbl { display:block; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; }
.opts { display:grid; gap:10px; margin:6px 0 12px; }
.opt { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--bg); }
.opt .k { font:700 13px var(--f-mono); color:var(--accent); margin-right:6px; }
.opt.rec { border-left-color:var(--good); }
.opt.picked { border-color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft); }
.breaks { border-left:3px solid var(--amber); padding:4px 0 4px 12px; }
.breaks::before { content:"⚠ "; color:var(--amber); font-weight:700; }
.proposal { border:1px solid var(--good); background:var(--good-soft); border-radius:10px; padding:10px 14px; }
.proposal .who { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--good); display:block; margin-bottom:2px; }
.figure { margin:14px 0 6px; min-height:140px; display:grid; place-items:center; background:var(--bg); border:1px dashed var(--line); border-radius:12px; padding:12px; overflow-x:auto; }
.figure svg { max-width:100%; height:auto; }
.answer { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
.answer textarea, .answer .annots { align-self:stretch; }
.choices { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.choice { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 14px; font-weight:700; font-size:14px; }
.choice:hover { border-color:var(--ink); }
.choice.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.choice .tag { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--good); }
.choice.on .tag { color:inherit; opacity:.8; }
textarea.note { width:100%; max-width:var(--measure); min-height:60px; resize:vertical; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:8px 12px; font-size:15px; line-height:1.5; }
.annots { display:flex; flex-direction:column; gap:6px; }
.annot { display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:13.5px; border-left:3px solid var(--amber); background:var(--amber-soft); border-radius:0 8px 8px 0; padding:6px 10px; max-width:var(--measure); }
.annot.att { border-left-color:var(--violet); background:var(--violet-soft); }
.annot q { font-style:italic; color:var(--muted); }
.annot button { grid-row:span 2; background:none; border:0; color:var(--muted); font-size:16px; }

/* outline */
.outline { display:flex; flex-direction:column; gap:6px; }
.oitem { text-align:left; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; padding:9px 10px; border:1px solid transparent; border-radius:10px; background:none; }
.oitem:hover { background:var(--surface); }
.oitem.cur { background:var(--surface); border-color:var(--accent); }
.oitem .qid { font:700 12px var(--f-mono); color:var(--muted); }
.oitem.done .qid { color:var(--good); }
.oitem .t { font-size:13.5px; line-height:1.35; }
.oitem .a { grid-column:2; font-size:12px; font-weight:700; color:var(--good); }
.oitem .c { grid-column:2; font-size:12px; font-weight:700; color:var(--violet); }
.col-h { font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 4px 4px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ret { font:12.5px/1.6 var(--f-mono); white-space:pre-wrap; background:var(--sunk); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0; overflow:auto; }
.ret .att { color:var(--violet); }

/* ---- the side chat, shared parts ---- */
.chat { display:flex; flex-direction:column; min-height:0; background:var(--surface); border:1px solid var(--violet); border-radius:16px; overflow:hidden; }
.chat-h { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--violet-soft); }
.chat-h .anchor { flex:1; min-width:0; font-size:13px; line-height:1.35; }
.chat-h .anchor b { font-family:var(--f-mono); color:var(--violet); }
.chat-h .anchor span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
.chat-h .x { background:none; border:0; font-size:18px; color:var(--muted); }
.fork-line { font-size:11.5px; color:var(--muted); padding:6px 14px; border-bottom:1px dashed var(--line); }
.msgs { flex:1; min-height:0; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:12px; overscroll-behavior:contain; }
.msg { max-width:62ch; font-size:14.5px; line-height:1.55; }
.msg.me { align-self:flex-end; background:var(--accent-soft); border-radius:12px 12px 2px 12px; padding:8px 12px; }
.msg.me q { display:block; font-size:12.5px; color:var(--muted); border-left:2px solid var(--violet); padding-left:8px; margin-bottom:4px; font-style:italic; }
.msg.ai { align-self:stretch; }
.msg.ai p { margin:0 0 8px; }
.reads { font:11.5px var(--f-mono); color:var(--muted); margin-bottom:6px; display:flex; flex-direction:column; gap:1px; }
.reads span::before { content:"↳ "; }
.typing { color:var(--muted); font-size:13px; }
.typing::after { content:"▍"; animation:blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }
.msg-actions { display:flex; gap:8px; align-items:center; margin-top:4px; }
.attach { font-size:12.5px; font-weight:700; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:2px 10px; }
.attach.on { background:var(--violet); color:var(--surface); border-color:var(--violet); }
.suggest { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 8px; }
.suggest button { font-size:12.5px; border:1px dashed var(--line); background:none; border-radius:999px; padding:3px 10px; color:var(--muted); text-align:left; }
.suggest button:hover { border-color:var(--violet); color:var(--ink); }
.composer { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background:var(--bg); align-items:flex-end; }
.composer textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:7px 10px; font-size:14.5px; line-height:1.4; min-height:38px; max-height:120px; }
.composer .quote { font-size:12px; color:var(--violet); font-style:italic; }
.empty { color:var(--muted); font-size:13.5px; padding:4px 2px; }

/* the decomposability verdict and the decomposition */
.verdict { display:flex; gap:10px; align-items:flex-start; padding:9px 14px; font-size:13px; line-height:1.45; border-bottom:1px solid var(--line); }
.verdict .dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; background:var(--muted); }
.verdict.ok .dot { background:var(--good); }
.verdict .why { color:var(--muted); }
.decomp { border:1px solid var(--line); border-radius:12px; background:var(--bg); padding:10px 12px; margin:6px 0; }
.decomp .dh { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:8px; }
.decomp .dh b { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--violet); }
.parts { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.part { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:3px 9px; font-size:13px; font-weight:600; }
.part.on, .link.on { border-color:var(--violet); box-shadow:0 0 0 2px var(--violet-soft); }
.links { display:flex; flex-direction:column; gap:4px; }
.link { text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:4px 9px; font-size:13px; display:flex; gap:8px; align-items:baseline; }
.basis { font:700 10.5px var(--f-mono); text-transform:uppercase; padding:0 5px; border-radius:4px; }
.basis.declared { color:var(--good); background:var(--good-soft); }
.basis.interpreted { color:var(--amber); background:var(--amber-soft); }
.src { margin-top:8px; font:12px/1.55 var(--f-mono); white-space:pre-wrap; background:var(--sunk); border-radius:8px; padding:8px 10px; border-left:3px solid var(--violet); }
.src .where { display:block; color:var(--violet); font-weight:700; margin-bottom:2px; }

/* popover for a selection: annotate or ask */
.pop { position:absolute; z-index:40; width:330px; background:var(--surface); border:1px solid var(--accent); border-radius:12px; box-shadow:0 12px 30px var(--shadow); padding:10px; display:flex; flex-direction:column; gap:8px; }
.pop q { font-size:12.5px; color:var(--muted); font-style:italic; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pop input { border:1px solid var(--line); border-radius:8px; background:var(--bg); padding:6px 10px; font-size:14px; }
.pop .row { display:flex; justify-content:flex-end; gap:8px; }
.pop .ask { background:var(--violet); border-color:var(--violet); color:var(--surface); }

.sheet-back { position:fixed; inset:0; background:rgba(10,20,35,.45); z-index:50; display:grid; place-items:center; padding:20px; }
.sheet { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px 24px; max-width:820px; width:100%; max-height:86vh; overflow:auto; display:flex; flex-direction:column; gap:14px; }
.sheet .row { display:flex; gap:10px; justify-content:flex-end; }

/* ---- page frame: three columns, each scrolls on its own so the block never leaves the screen ---- */
.frame { display:grid; gap:18px; padding:16px 18px 70px; height:calc(100vh - var(--top)); }
.frame > * { min-height:0; overflow:auto; }
.frame > .outline { padding-right:4px; }
.center { display:flex; flex-direction:column; gap:14px; }

/* A: chat takes the right column; the return folds to a strip under it */
.va { grid-template-columns:230px minmax(0,1fr) minmax(340px,400px); }
.va .right { display:flex; flex-direction:column; gap:10px; overflow:hidden; }
.va .right .chat { flex:1; }
.retstrip { border:1px solid var(--line); border-radius:12px; background:var(--surface); }
.retstrip summary { cursor:pointer; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--muted); }
.retstrip .ret { max-height:34vh; border:0; border-radius:0 0 12px 12px; }
.va .right.idle { overflow:auto; }

/* B: the centre splits, block above, chat below; the right column keeps the return */
.vb { grid-template-columns:230px minmax(0,1fr) 320px; }
.vb .center.split { overflow:hidden; display:grid; grid-template-rows:minmax(120px,1fr) minmax(0,1.15fr); }
.vb .center.split .blockwrap { overflow:auto; min-height:0; border-radius:16px; }
.vb .center.split .chat { min-height:0; }
.tabs { display:flex; gap:4px; padding:6px 10px 0; border-bottom:1px solid var(--line); overflow-x:auto; background:var(--surface); }
.tab { border:1px solid transparent; border-bottom:0; background:none; border-radius:8px 8px 0 0; padding:4px 10px; font-size:12.5px; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
.tab.on { border-color:var(--line); background:var(--bg); color:var(--ink); font-weight:700; }
.tab.att::after { content:" 📎"; }
.vb .right { display:flex; flex-direction:column; gap:6px; }

/* C: thread cards in the margin, the return lives in the review sheet */
.vc { grid-template-columns:230px minmax(0,1fr) minmax(320px,380px); }
.margin { display:flex; flex-direction:column; gap:10px; }
.card { border:1px solid var(--line); background:var(--surface); border-radius:12px; overflow:hidden; }
.card.cur { border-color:var(--violet); box-shadow:0 0 0 2px var(--violet-soft); }
.card .ch { display:flex; gap:8px; align-items:baseline; padding:8px 12px; cursor:pointer; background:none; border:0; width:100%; text-align:left; }
.card .ch q { flex:1; min-width:0; font-size:13px; font-style:italic; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .ch .n { font:700 11.5px var(--f-mono); color:var(--violet); }
.card .chat { border:0; border-top:1px solid var(--line); border-radius:0; max-height:62vh; }
.card .last { padding:0 12px 8px; font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.judge-btn { font-size:12px; font-weight:700; border:1px solid var(--violet); color:var(--violet); background:none; border-radius:999px; padding:3px 10px; white-space:nowrap; }
.judge-box { margin:-4px 0 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; overflow:hidden; }
.judge-box .verdict { border:0; }

.switcher { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:60; display:flex; align-items:center; gap:6px; background:#111; color:#fff; border-radius:999px; padding:6px 8px; box-shadow:0 8px 24px rgba(0,0,0,.35); font:600 13px var(--f-body); }
.switcher button { background:#333; color:#fff; border:0; border-radius:999px; width:30px; height:30px; }
.switcher span { padding:0 10px; white-space:nowrap; }
.width { position:fixed; bottom:18px; right:16px; z-index:60; font:600 11.5px var(--f-mono); background:#111; color:#fff; border-radius:6px; padding:3px 7px; opacity:.75; }

.narrow-only { display:none !important; }
/* narrow windows: the surface often sits beside a terminal (#78). The outline becomes a rail first, then columns stack into drawers. */
@media (max-width:1180px) {
  .frame { grid-template-columns:64px minmax(0,1fr) minmax(300px,360px) !important; }
  .oitem { grid-template-columns:1fr; padding:8px 6px; text-align:center; }
  .oitem .t, .oitem .a, .tailnote, .col-h.outline-h { display:none; }
  .oitem .c { grid-column:1; }
}
@media (max-width:860px) {
  .frame { grid-template-columns:52px minmax(0,1fr) !important; }
  .frame > .right, .frame > .margin { position:fixed; top:var(--top); right:0; bottom:0; width:min(420px,92vw); z-index:30; background:var(--bg); padding:10px; border-left:1px solid var(--line); box-shadow:-10px 0 30px var(--shadow); display:none; }
  .frame > .right.open, .frame > .margin.open { display:flex; }
  .vb .right { display:none !important; }
  .narrow-only { display:inline-flex !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="switcher" id="switcher"></div>
<div class="width" id="width"></div>
<script>
'use strict';

// ---------- the round (fixture): issue #69, as in prototypes/round ----------
const ROUND = {
  title: 'Cosa contiene il record dell’overview, e come lo controlla l’host?',
  origin: 'grill-with-docs · #69 · round 2',
  blocks: [
    { id:'Q2', title:'Cosa contiene un ruolo? (seguito)', kind:'proposal',
      body:`<p><span class="lbl">Prova di deriva</span>Con (a) una cartella di capitoli dà membri <code>{ ch3.md, 1, 220 }</code>, e un unico documento lungo dà membri <code>{ book.md, 120, 340 }</code>. È la stessa forma.</p>
<p><span class="lbl">Problema di termini</span>Nell’exploration un <code>member</code> è un componente nominato che ha <code>does</code> e <code>cites</code>; usarlo anche per “i file di un ruolo” gli dà due significati.</p>`,
      proposal:`Scelgo (a). Il ruolo contiene (<em>holds</em>) nodi del digest, file interi o sezioni elencate, scritti come <code>{ file, from, to }</code>. L’host accetta solo intervalli che coincidono con un nodo del digest. Niente <code>member</code> per questo; Role entra nel glossario con “holds”.` },
    { id:'Q3', title:'Chi produce i legami dichiarati tra ruoli?', kind:'choice', rec:'a',
      body:`<p>Il digest contiene già legami file→file dichiarati dal parser, con il loro <code>file:line</code>.</p>`,
      options:[
        { k:'a', html:`L’host deriva i bond dichiarati: se un file del ruolo A importa un file del ruolo B, l’host crea il bond A→B (<code>basis: declared</code>) e cita gli import. Il modello aggiunge solo i legami che legge nei doc del digest, <code>declared</code> se le righe lo dicono a parole e <code>interpreted</code> altrimenti.` },
        { k:'b', html:`Il modello scrive tutti i legami e l’host controlla che ogni <code>declared</code> citi un import del digest tra file dei due ruoli.` } ],

const VARIANTS = { A:'Colonna accanto al blocco', B:'Sotto il blocco', C:'Fili nel margine' };

// ---------- state (memory only) ----------
const q0 = new URLSearchParams(location.search).get('variant');
const S = {
  variant: VARIANTS[q0] ? q0 : 'A',
  theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'blueprint' : 'paper',
  focus: 1,
  answers: Object.fromEntries(B.map(b => [b.id, { choice:null, note:'', noteOpen:false }])),
  annots: [],            // { n, block, start, end, quote, comment }
  threads: [],           // { id, block, quote, start, end, msgs:[{ role, text, reads, decomp, attached, streaming }] }
  open: null,            // id of the open thread (null = chat closed)
  judged: {},            // C: block id → true once the owner asked for the verdict
  drafts: {},            // thread id → unsent text
  pendingQuote: null,    // A/B: a selected span waiting to be asked about
  picked: {},            // decomposition: thread msg key → selected link index
  review: false,
  drawer: false,         // narrow windows: right column open as a drawer
};
let seq = 0;

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
const choicesOf = b => b.kind === 'choice' ? b.options.map(o => o.k) : ['sì', 'no'];
const recOf = b => b.kind === 'choice' ? b.rec : 'sì';
const answered = b => S.answers[b.id].choice !== null;
const doneCount = () => B.filter(answered).length;
const choiceLabel = (b, k) => b.kind === 'choice' ? `(${k})` : (k === 'sì' ? 'Sì' : 'No');
const annotsOf = id => S.annots.filter(a => a.block === id);
const threadsOf = id => S.threads.filter(t => t.block === id);
const thread = id => S.threads.find(t => t.id === id);
const cur = () => B[S.focus];
const attachedOf = id => threadsOf(id).flatMap(t => t.msgs.map((m, i) => ({ t, m, q: t.msgs[i - 1] })).filter(x => x.m.attached));
const firstSentence = s => { const p = s.replace(/[`*]/g, '').split(/(?<=[.:;])\s/)[0]; return p.length > 140 ? p.slice(0, 137) + '…' : p; };

function summary(b) {
  const a = S.answers[b.id]; if (!a.choice) return '';
  const extra = [a.note && 'nota', annotsOf(b.id).length && `${annotsOf(b.id).length} annot.`, attachedOf(b.id).length && `${attachedOf(b.id).length} 📎`].filter(Boolean).join(' · ');
  return choiceLabel(b, a.choice) + (a.choice === recOf(b) ? ' ✓' : '') + (extra ? ' · ' + extra : '');
}

// What the agent receives. Attached side-chat exchanges ride under their block; everything else in a side chat stays out.
function returnLines() {
  const L = [{ t:`Risposte al round «${ROUND.title}» (${doneCount()}/${B.length})` }, { t:'' }];
  for (const b of B) {
    const a = S.answers[b.id];
    L.push({ t: a.choice ? `${b.id} · ${choiceLabel(b, a.choice)}${a.choice === recOf(b) ? ' (come proposto)' : ''}` : `${b.id} · — non risposta` });
    if (a.note.trim()) L.push({ t:'  nota: ' + a.note.trim().replace(/\n/g, '\n        ') });
    for (const n of annotsOf(b.id)) L.push({ t:`  su «${n.quote}»: ${n.comment}` });
    for (const x of attachedOf(b.id)) {
      L.push({ t:`  dalla chat laterale${x.t.quote ? ` su «${x.t.quote}»` : ''}:`, att:true });
      if (x.q) L.push({ t:`    D: ${x.q.text}`, att:true });
      L.push({ t:`    R: ${x.m.decomp ? '[scomposizione: ' + x.m.decomp.title + ', ' + x.m.decomp.links.length + ' legami] ' : ''}${firstSentence(x.m.text)}`, att:true });
    }
  }
  return L;
}
const returnText = () => returnLines().map(l => l.t).join('\n');
const returnHtml = () => returnLines().map(l => l.att ? `<span class="att">${esc(l.t)}</span>` : esc(l.t)).join('\n');

// ---------- the block ----------
function blockHtml(b, { chatting = false, judgeSlot = '' } = {}) {
  const a = S.answers[b.id];
  const opts = b.kind === 'choice' ? `<div class="opts">${b.options.map(o =>
    `<div class="opt${o.k === b.rec ? ' rec' : ''}${a.choice === o.k ? ' picked' : ''}"><span class="k">(${o.k})</span>${o.html}</div>`).join('')}</div>` : '';
  const choices = choicesOf(b).map((k, i) => `<button class="choice${a.choice === k ? ' on' : ''}" data-act="choose" data-b="${b.id}" data-k="${k}">
      ${choiceLabel(b, k)}${k === recOf(b) ? '<span class="tag">proposta</span>' : ''}<span class="kbd">${i + 1}</span></button>`).join('');
  const note = a.noteOpen || a.note
    ? `<textarea class="note" data-note="${b.id}" placeholder="Una nota per l’agente (facoltativa)">${esc(a.note)}</textarea>`
    : `<button class="linkish" data-act="note" data-b="${b.id}">+ nota</button>`;
  const ann = annotsOf(b.id).map(n => `<div class="annot"><q>${esc(n.quote)}</q><button title="Rimuovi" data-act="unannot" data-n="${n.n}">×</button><span>${esc(n.comment)}</span></div>`).join('');
  const att = attachedOf(b.id).map(x => `<div class="annot att"><q>📎 ${esc(x.q ? x.q.text : 'dalla chat laterale')}</q><button title="Stacca" data-act="detach" data-t="${x.t.id}" data-m="${x.t.msgs.indexOf(x.m)}">×</button><span>${esc(firstSentence(x.m.text))}</span></div>`).join('');
  const chatBtn = S.variant === 'C' ? '' : `<button class="ghost sm" data-act="chat" title="Chat laterale (c)">💬 Chiedi <span class="kbd">c</span></button>`;
  return `<article class="block${chatting ? ' chatting' : ''}" id="blk-${b.id}">
    <div class="bhead"><span class="qid">${b.id} · ${S.focus + 1} di ${B.length}</span>${chatBtn}${S.variant === 'C' ? judgeSlot : ''}</div>
    <h2>${b.title}</h2>
    ${S.variant === 'C' ? judgeBox(b) : ''}
    <div class="body" data-body="${b.id}">${b.body}${opts}${b.after || ''}
      <div class="proposal"><span class="who">Proposta dell’agente</span>${b.proposal}</div></div>
    ${b.diagram ? `<div class="figure" data-fig="${b.id}"></div>` : ''}
    <div class="answer"><div class="choices">${choices}</div>${note}
      ${ann || att ? `<div class="annots">${ann}${att}</div>` : ''}
      <span class="hint">Seleziona del testo per annotarlo o per chiedere su quel passaggio.</span></div>
  </article>`;
}

function outlineHtml() {
  return `<nav class="outline"><h3 class="col-h outline-h">Domande</h3>${B.map((x, i) => {
    const n = threadsOf(x.id).length;
    return `<button class="oitem${answered(x) ? ' done' : ''}${i === S.focus ? ' cur' : ''}" data-act="focus" data-i="${i}" title="${esc(x.title)}">
      <span class="qid">${x.id}</span><span class="t">${x.title}</span>${answered(x) ? `<span class="a">${summary(x)}</span>` : ''}${n ? `<span class="c">💬 ${n}</span>` : ''}</button>`; }).join('')}
    <p class="hint tailnote" style="margin-top:12px">${ROUND.tail}</p></nav>`;
}

// ---------- the side chat ----------
function verdictHtml(b) {
  const v = MOCK[b.id].verdict;
  return `<div class="verdict${v.ok ? ' ok' : ''}"><span class="dot"></span><div><b>${v.ok ? 'Scomponibile con Break the Wall' : 'Risposta semplice in sola lettura'}</b>
    <div class="why">${esc(v.why)}</div></div></div>`;
}
function judgeBox(b) { return S.judged[b.id] ? `<div class="judge-box">${verdictHtml(b)}</div>` : ''; }

function decompHtml(d, key) {
  const sel = S.picked[key];
  const on = sel != null ? d.links[sel] : null;
  return `<div class="decomp"><div class="dh"><b>Scomposizione · ${esc(d.title)}</b><span class="hint">${d.parts.length} parti · ${d.links.length} legami</span></div>
    <div class="parts">${d.parts.map(p => `<span class="part${on && (on.from === p || on.to === p) ? ' on' : ''}">${esc(p)}</span>`).join('')}</div>
    <div class="links">${d.links.map((l, i) => `<button class="link${i === sel ? ' on' : ''}" data-act="pick" data-key="${key}" data-i="${i}">
      <span class="basis ${l.basis}">${l.basis}</span><span>${esc(l.from)} → ${esc(l.to)}: ${esc(l.label)}</span></button>`).join('')}</div>
    ${on ? `<div class="src"><span class="where">${esc(on.where)}</span>${esc(on.src)}</div>` : '<p class="hint" style="margin-top:6px">Tocca un legame per vedere la riga che lo sostiene.</p>'}</div>`;
}

function msgHtml(t, m, i) {
  if (m.role === 'me') return `<div class="msg me">${t.quote && i === 0 ? `<q>«${esc(t.quote)}»</q>` : ''}${esc(m.text)}</div>`;
  if (m.streaming && !m.shown) return `<div class="msg ai"><div class="reads">${(m.readsShown || []).map(r => `<span>${esc(r)}</span>`).join('')}</div><span class="typing">${m.phase || 'avvio del fork…'}</span></div>`;
  const key = `${t.id}:${i}`;
  return `<div class="msg ai"><div class="reads">${m.reads.map(r => `<span>${esc(r)}</span>`).join('')}</div>
    <p>${md(m.shown)}${m.streaming ? '<span class="typing"></span>' : ''}</p>
    ${m.decomp && !m.streaming ? decompHtml(m.decomp, key) : ''}
    ${m.streaming ? '' : `<div class="msg-actions"><button class="attach${m.attached ? ' on' : ''}" data-act="attach" data-t="${t.id}" data-m="${i}">${m.attached ? '📎 allegato a ' + t.block : '📎 Allega alla risposta'}</button>
      ${m.attached ? '' : '<span class="hint">resta fuori da ciò che riceve l’agente</span>'}</div>`}</div>`;
}

function chatHtml(b, t, { showVerdict = false, header = true } = {}) {
  const quote = t ? t.quote : S.pendingQuote?.quote;
  const msgs = t ? t.msgs.map((m, i) => msgHtml(t, m, i)).join('') : `<p class="empty">Chiedi qualcosa su ${b.id}. La risposta viene da una copia in sola lettura della sessione: legge il repository, non scrive nella conversazione principale.</p>`;
  const asked = t ? t.msgs.filter(m => m.role === 'me').map(m => m.text) : [];
  const sugg = MOCK[b.id].suggest.filter(s => !asked.includes(s));
  const draftKey = t ? t.id : 'new:' + b.id;
  return `<section class="chat">
    ${header ? `<div class="chat-h"><div class="anchor"><b>${b.id}</b> · chat laterale<span>${quote ? '«' + esc(quote) + '»' : esc(b.title)}</span></div><button class="x" data-act="close-chat" title="Chiudi (Esc)">×</button></div>` : ''}
    <div class="fork-line">Fork in sola lettura · Read · Grep · Glob · conosce la conversazione fino a questo round</div>
    ${showVerdict ? verdictHtml(b) : ''}
    <div class="msgs" data-msgs>${msgs}</div>
    ${sugg.length ? `<div class="suggest">${sugg.map(s => `<button data-act="ask-s" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
    <div class="composer"><textarea rows="1" data-draft="${draftKey}" placeholder="${quote && !t ? 'Chiedi su «' + esc(quote.slice(0, 30)) + '…»' : 'Chiedi (Invio per inviare)'}">${esc(S.drafts[draftKey] || '')}</textarea>
      <button class="primary" data-act="ask">Chiedi</button></div>
  </section>`;
}

// ---------- variants ----------
// A: one thread per block, in the right column; the chat follows the focused block. The verdict is the chat's first line.
function variantA() {
  const b = cur();
  const t = threadsOf(b.id)[0] || null;
  const chatOpen = S.open !== null;
  const right = chatOpen
    ? `${chatHtml(b, t, { showVerdict:true })}
       <details class="retstrip"><summary>Cosa riceve l’agente · ${doneCount()}/${B.length}${attachedOf(b.id).length ? ' · 📎 ' + attachedOf(b.id).length : ''}</summary><pre class="ret" data-live="ret">${returnHtml()}</pre></details>`
    : `<h3 class="col-h">Cosa riceve l’agente</h3><pre class="ret" data-live="ret">${returnHtml()}</pre>
       <p class="hint">Premi <span class="kbd">c</span> o “Chiedi” sul blocco: la chat prende questa colonna, accanto al blocco.</p>`;
  return `<main class="frame va">${outlineHtml()}
    <div class="center">${blockHtml(b, { chatting: chatOpen })}</div>
    <aside class="right${chatOpen ? '' : ' idle'}${S.drawer ? ' open' : ''}">${right}</aside></main>`;
}

// B: the centre splits; the block stays on top, the chat sits below it. Several threads per block, as tabs.
function variantB() {
  const b = cur();
  const ts = threadsOf(b.id);
  const t = thread(S.open);
  const chatOpen = S.open !== null && (t ? t.block === b.id : S.open === 'new:' + b.id);
  const tabs = `<div class="tabs">${ts.map((x, i) => `<button class="tab${x === t ? ' on' : ''}${x.msgs.some(m => m.attached) ? ' att' : ''}" data-act="tab" data-t="${x.id}">${x.quote ? '«' + esc(x.quote) + '»' : 'Filo ' + (i + 1)}</button>`).join('')}
    <button class="tab${!t ? ' on' : ''}" data-act="tab-new">+ nuovo filo</button></div>`;
  const chat = chatOpen ? chatHtml(b, t, { header:true }).replace('<div class="fork-line">', tabs + '<div class="fork-line">') : '';
  return `<main class="frame vb">${outlineHtml()}
    <div class="center${chatOpen ? ' split' : ''}"><div class="blockwrap">${blockHtml(b, { chatting: chatOpen })}</div>${chat}</div>
    <aside class="right"><h3 class="col-h">Cosa riceve l’agente</h3><pre class="ret" data-live="ret">${returnHtml()}</pre></aside></main>`;
}

// C: threads are margin cards anchored to passages; the verdict is asked for on the block; the return is in the review sheet.
function variantC() {
  const b = cur();
  const ts = threadsOf(b.id);
  const cards = ts.map((t, i) => {
    const isCur = t.id === S.open;
    const last = [...t.msgs].reverse().find(m => m.role === 'ai' && m.shown);
    return `<div class="card${isCur ? ' cur' : ''}" data-hover="${t.id}"><button class="ch" data-act="tab" data-t="${t.id}"><span class="n">${i + 1}</span><q>${t.quote ? '«' + esc(t.quote) + '»' : 'Tutto il blocco'}</q>${t.msgs.some(m => m.attached) ? '📎' : ''}</button>
      ${isCur ? chatHtml(b, t, { header:false }) : (last ? `<div class="last">${esc(firstSentence(last.text))}</div>` : '')}</div>`; }).join('');
  const newCard = S.open === 'new:' + b.id
    ? `<div class="card cur"><div class="ch"><span class="n">+</span><q>${S.pendingQuote ? '«' + esc(S.pendingQuote.quote) + '»' : 'Tutto il blocco'}</q></div>${chatHtml(b, null, { header:false })}</div>` : '';
  const judgeSlot = S.judged[b.id] ? '' : `<button class="judge-btn" data-act="judge" title="Un fork valuta se dietro il blocco c’è abbastanza fonte">Scomponibile?</button>`;
  return `<main class="frame vc">${outlineHtml()}
    <div class="center">${blockHtml(b, { chatting: ts.some(t => t.id === S.open) || !!newCard, judgeSlot })}</div>
    <aside class="margin${S.drawer ? ' open' : ''}"><h3 class="col-h">Fili su ${b.id}<button class="ghost sm" data-act="c-new">+ filo sul blocco</button></h3>
      ${cards}${newCard}${!ts.length && !newCard ? '<p class="empty">Nessun filo. Seleziona un passaggio e scegli “Chiedi”, o apri un filo su tutto il blocco.</p>' : ''}</aside></main>`;
}

function topBar() {
  const v = S.variant;
  return `<header class="top">
    <span class="proto-tag">Prototipo · risposte finte</span>
    <div class="title"><small>${ROUND.origin}</small><strong>${ROUND.title}</strong></div>
    <span class="count" data-live="count"><b>${doneCount()}</b>/${B.length} risposte</span>
    <button class="ghost narrow-only" data-act="${v === 'B' ? 'review' : 'drawer'}">${v === 'C' ? 'Fili' : v === 'A' ? 'Chat / ritorno' : 'Ritorno'}</button>
    <button class="primary" data-act="review">Rivedi e invia <span class="kbd" style="color:inherit;border-color:currentColor">r</span></button>
    <button class="ghost" data-act="theme" title="Tema (t)">${S.theme === 'paper' ? 'Blueprint' : 'Paper'}</button>
  </header>`;
}

function reviewSheet() {
  const missing = B.filter(b => !answered(b)).map(b => b.id);
  const loose = S.threads.filter(t => t.msgs.some(m => m.role === 'ai') && !t.msgs.some(m => m.attached)).length;
  return `<div class="sheet-back" data-act="close-review"><div class="sheet" role="dialog" aria-label="Rivedi le risposte">
    <h2 style="font-family:var(--f-display)">Rivedi le risposte</h2>
    ${missing.length ? `<p class="hint">Senza risposta: ${missing.join(', ')}. Puoi inviare lo stesso.</p>` : ''}
    ${loose ? `<p class="hint">${loose} fil${loose === 1 ? 'o' : 'i'} di chat laterale non allegat${loose === 1 ? 'o' : 'i'}: restano sulla pagina, l’agente non li vede.</p>` : ''}
    <pre class="ret">${returnHtml()}</pre>
    <div class="row"><button class="ghost" data-act="close-review">Torna al round <span class="kbd">Esc</span></button><button class="ghost" data-act="copy">Copia</button><button class="primary" data-act="send">Invia all’agente</button></div>
  </div></div>`;
}

// ---------- render ----------
const svgCache = new Map(); let dseq = 0;
function render() {
  // Keep the reader's place: scroll positions and the focused draft survive a re-render, so nothing jumps.
  const keep = {}; document.querySelectorAll('.frame > *, [data-msgs], .blockwrap').forEach((n, i) => keep[i] = n.scrollTop);
  const active = document.activeElement?.dataset?.draft;
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('app').innerHTML = topBar() + ({ A:variantA, B:variantB, C:variantC }[S.variant])() + (S.review ? reviewSheet() : '');
  document.querySelectorAll('.frame > *, [data-msgs], .blockwrap').forEach((n, i) => { if (keep[i] != null) n.scrollTop = keep[i]; });
  document.querySelectorAll('[data-msgs]').forEach(n => { if (n.dataset.stick !== '0') n.scrollTop = n.scrollHeight; });
  if (active) { const el = document.querySelector(`[data-draft="${active}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  document.getElementById('switcher').innerHTML = `<button data-act="vprev" aria-label="Variante precedente">‹</button><span>${S.variant} (${VARIANTS[S.variant]})</span><button data-act="vnext" aria-label="Variante successiva">›</button>`;
  paintHighlights(); paintDiagrams();
}
function renderLive() {
  document.querySelectorAll('[data-live="count"]').forEach(n => n.innerHTML = `<b>${doneCount()}</b>/${B.length} risposte`);
  document.querySelectorAll('[data-live="ret"]').forEach(n => n.innerHTML = returnHtml());
}
async function paintDiagrams() {
  if (!window.mermaid) { document.querySelectorAll('.figure').forEach(f => f.textContent = 'Mermaid non caricato (offline?)'); return; }
  for (const fig of document.querySelectorAll('.figure')) {
    const b = B.find(x => x.id === fig.dataset.fig); const key = `${b.id}:${S.theme}`;
    if (!svgCache.has(key)) {
      mermaid.initialize({ startOnLoad:false, securityLevel:'strict', theme: S.theme === 'blueprint' ? 'dark' : 'neutral', fontFamily:'inherit' });
      try { svgCache.set(key, (await mermaid.render(`d${++dseq}`, b.diagram)).svg); } catch (e) { svgCache.set(key, `<span class="hint">Diagramma non valido</span>`); }
    }
    if (fig.isConnected) fig.innerHTML = svgCache.get(key);
  }
}
const W = () => { document.getElementById('width').textContent = innerWidth + ' px'; };
addEventListener('resize', W); W();

// ---------- highlights: annotations (amber) and passages a side chat is anchored to (violet) ----------
function textNodes(root) { const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const o = []; let n; while ((n = w.nextNode())) o.push(n); return o; }
function offsetOf(root, node, off) { const r = document.createRange(); r.setStart(root, 0); r.setEnd(node, off); return r.toString().length; }
function rangeFrom(root, start, end) {
  let pos = 0; const r = document.createRange(); let started = false;
  for (const t of textNodes(root)) { const len = t.data.length;
    if (!started && start <= pos + len) { r.setStart(t, start - pos); started = true; }
    if (started && end <= pos + len) { r.setEnd(t, end - pos); return r; }
    pos += len; }
  return null;
}
let hoverThread = null;
function paintHighlights() {
  if (!window.CSS || !CSS.highlights) return;
  const mk = list => list.map(n => { const root = document.querySelector(`[data-body="${n.block}"]`); return root && rangeFrom(root, n.start, n.end); }).filter(Boolean);
  CSS.highlights.set('btw-annot', new Highlight(...mk(S.annots)));
  // The open thread's passage is always lit; in C, hovering a card lights its passage too.
  const lit = S.threads.filter(t => t.quote && (t.id === S.open || t.id === hoverThread));
  const pend = S.pendingQuote && S.open === 'new:' + cur().id ? [S.pendingQuote] : [];
  CSS.highlights.set('btw-chat', new Highlight(...mk([...lit, ...pend])));
}
document.addEventListener('mouseover', e => { const c = e.target.closest('[data-hover]'); const id = c ? c.dataset.hover : null; if (id !== hoverThread) { hoverThread = id; paintHighlights(); } });

let pending = null;
document.addEventListener('mouseup', e => {
  if (e.target.closest('.pop')) return;
  const sel = getSelection(); if (!sel || sel.isCollapsed) return;
  const root = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest('[data-body]');
  const range = sel.getRangeAt(0);
  if (!root || !root.contains(range.endContainer)) return;
  const quote = range.toString().replace(/\s+/g, ' ').trim(); if (!quote) return;
  pending = { block: root.dataset.body, start: offsetOf(root, range.startContainer, range.startOffset), end: offsetOf(root, range.endContainer, range.endOffset), quote };
  showPop(range.getBoundingClientRect());
});
function showPop(rect) {
  closePop();
  const p = document.createElement('div'); p.className = 'pop';
  p.innerHTML = `<q>${esc(pending.quote)}</q><input placeholder="Commento per l’agente (annotazione)" />
    <div class="row"><button class="ghost" data-act="pop-cancel">Annulla</button><button class="ghost ask" data-act="pop-ask" title="Apre la chat laterale su questo passaggio">💬 Chiedi qui</button><button class="primary" data-act="pop-save">Annota</button></div>`;
  p.style.left = Math.min(innerWidth - 350, Math.max(12, rect.left + scrollX)) + 'px';
  p.style.top = (rect.bottom + scrollY + 8) + 'px';
  document.body.appendChild(p);
  const input = p.querySelector('input'); input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') savePop(); if (e.key === 'Escape') closePop(); });
}
function savePop() {
  const input = document.querySelector('.pop input');
  if (pending && input && input.value.trim()) S.annots.push({ n: ++seq, ...pending, comment: input.value.trim() });
  closePop(); getSelection().removeAllRanges(); render();
}
function askHere() {
  const p = pending; closePop(); getSelection().removeAllRanges();
  S.pendingQuote = p;
  if (S.variant === 'A') {
    // A has one thread per block: the passage becomes the quote of the next question in it.
    S.open = 'A'; render(); document.querySelector('[data-draft]')?.focus(); return;
  }
  S.open = 'new:' + p.block; S.drawer = true; render(); document.querySelector('[data-draft]')?.focus();
}
function closePop() { document.querySelector('.pop')?.remove(); }

// ---------- asking: a mocked fork, ~3 s to first token as witnessed on #74, then streamed ----------
function ask(text) {
  text = text.trim(); if (!text) return;
  const b = cur();
  let t;
  if (S.variant === 'A') t = threadsOf(b.id)[0];
  else t = thread(S.open);
  if (!t) {
    const pq = S.pendingQuote && S.pendingQuote.block === b.id ? S.pendingQuote : null;
    t = { id: 't' + (++seq), block: b.id, quote: pq?.quote || null, start: pq?.start, end: pq?.end, msgs: [] };
    S.threads.push(t);
  } else if (S.variant === 'A' && S.pendingQuote) {
    text = `Su «${S.pendingQuote.quote}»: ${text}`;
  }
  S.pendingQuote = null;
  delete S.drafts[S.open && S.open.startsWith('new:') ? S.open : t.id]; delete S.drafts['new:' + b.id]; delete S.drafts[t.id];
  if (S.variant !== 'A') S.open = t.id; else S.open = 'A';
  const r = MOCK[b.id].replies[text] || MOCK[b.id].replies[text.replace(/^Su «.*?»: /, '')] || GENERIC(text);
  t.msgs.push({ role:'me', text });
  const m = { role:'ai', text: r.text, reads: r.reads, decomp: r.decomp, attached:false, streaming:true, shown:'', readsShown:[], phase:'avvio del fork…' };
  t.msgs.push(m);
  render();
  let k = 0;
  const readStep = () => { if (k < m.reads.length) { m.readsShown.push(m.reads[k++]); m.phase = 'leggo il repository…'; render(); setTimeout(readStep, 700); } else stream(); };
  setTimeout(readStep, 2300);
  function stream() {
    const words = m.text.split(/(\s+)/); let i = 0;
    const tick = setInterval(() => { i += 3; m.shown = words.slice(0, i).join(''); if (i >= words.length) { m.shown = m.text; m.streaming = false; clearInterval(tick); } render(); }, 45);
  }
}

// ---------- actions ----------
function setFocus(i) {
  S.focus = Math.max(0, Math.min(B.length - 1, i));
  // A: the chat follows the block. B and C: an open thread belongs to its block, so moving away closes it.
  if (S.variant !== 'A' && S.open) { const t = thread(S.open); if (!t || t.block !== cur().id) S.open = null; }
  S.pendingQuote = null; render();
}
function openChat() {
  const b = cur();
  if (S.variant === 'A') S.open = 'A';
  else if (S.variant === 'B') S.open = threadsOf(b.id).at(-1)?.id || 'new:' + b.id;
  else S.open = 'new:' + b.id;
  S.drawer = true; render(); document.querySelector('[data-draft]')?.focus();
}
function setVariant(v) { S.variant = v; S.open = null; S.pendingQuote = null; S.drawer = false; const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); render(); }
function cycleVariant(d) { const ks = Object.keys(VARIANTS); setVariant(ks[(ks.indexOf(S.variant) + d + ks.length) % ks.length]); }
async function copy() { try { await navigator.clipboard.writeText(returnText()); toast('Copiato'); } catch { toast('Copia non riuscita'); } }
function toast(msg) { const t = document.querySelector('.switcher span'); if (t) { const o = t.textContent; t.textContent = msg; setTimeout(() => t.textContent = o, 1000); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('sheet-back') && e.target !== el) return;
  const a = el.dataset.act;
  if (a === 'focus') setFocus(+el.dataset.i);
  else if (a === 'choose') { const x = S.answers[el.dataset.b]; x.choice = x.choice === el.dataset.k ? null : el.dataset.k; render(); }
  else if (a === 'note') { S.answers[el.dataset.b].noteOpen = true; render(); document.querySelector(`[data-note="${el.dataset.b}"]`)?.focus(); }
  else if (a === 'unannot') { S.annots = S.annots.filter(n => n.n !== +el.dataset.n); render(); }
  else if (a === 'chat') openChat();
  else if (a === 'close-chat') { S.open = null; S.pendingQuote = null; S.drawer = false; render(); }
  else if (a === 'ask') { const ta = el.closest('.composer').querySelector('textarea'); ask(ta.value); }
  else if (a === 'ask-s') ask(el.dataset.q);
  else if (a === 'attach' || a === 'detach') { const m = thread(el.dataset.t).msgs[+el.dataset.m]; m.attached = a === 'attach' ? !m.attached : false; render(); }
  else if (a === 'pick') { S.picked[el.dataset.key] = S.picked[el.dataset.key] === +el.dataset.i ? null : +el.dataset.i; render(); }
  else if (a === 'tab') { S.open = S.open === el.dataset.t && S.variant === 'C' ? null : el.dataset.t; S.pendingQuote = null; render(); }
  else if (a === 'tab-new' || a === 'c-new') { S.open = 'new:' + cur().id; S.pendingQuote = null; render(); document.querySelector('[data-draft]')?.focus(); }
  else if (a === 'judge') { S.judged[cur().id] = 'loading'; el.textContent = 'valuto…'; el.disabled = true; setTimeout(() => { S.judged[cur().id] = true; render(); }, 2600); }
  else if (a === 'drawer') { S.drawer = !S.drawer; render(); }
  else if (a === 'review') { S.review = true; render(); }
  else if (a === 'close-review') { S.review = false; render(); }
  else if (a === 'send') { S.review = false; render(); toast('Inviato (finto)'); }
  else if (a === 'copy') copy();
  else if (a === 'theme') { S.theme = S.theme === 'paper' ? 'blueprint' : 'paper'; render(); }
  else if (a === 'vprev') cycleVariant(-1);
  else if (a === 'vnext') cycleVariant(1);
  else if (a === 'pop-save') savePop();
  else if (a === 'pop-ask') askHere();
  else if (a === 'pop-cancel') closePop();
});
document.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d?.note) { S.answers[d.note].note = e.target.value; renderLive(); }
  if (d?.draft) S.drafts[d.draft] = e.target.value;
});
document.addEventListener('scroll', e => { if (e.target.dataset && 'msgs' in e.target.dataset) { const n = e.target; n.dataset.stick = n.scrollHeight - n.scrollTop - n.clientHeight < 30 ? '1' : '0'; } }, true);
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('textarea[data-draft]') && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(t.value); return; }
  if (t.matches('input, textarea, [contenteditable]')) { if (e.key === 'Escape') t.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const b = cur();
  if (e.key === 'Escape') { if (S.review) S.review = false; else if (S.open) { S.open = null; S.pendingQuote = null; S.drawer = false; } closePop(); render(); return; }
  if (S.review) return;
  if (e.key === 'j') setFocus(S.focus + 1);
  else if (e.key === 'k') setFocus(S.focus - 1);
  else if (/^[1-4]$/.test(e.key)) { const k = choicesOf(b)[+e.key - 1]; if (k) { S.answers[b.id].choice = k; render(); } }
  else if (e.key === 'y') { S.answers[b.id].choice = recOf(b); render(); }
  else if (e.key === 'c') { e.preventDefault(); openChat(); }
  else if (e.key === 'r') { S.review = true; render(); }
  else if (e.key === 't') { S.theme = S.theme === 'paper' ? 'blueprint' : 'paper'; render(); }
  else if (e.key === 'ArrowLeft') cycleVariant(-1);
  else if (e.key === 'ArrowRight') cycleVariant(1);
});

render();
</script>
</body>
</html>
