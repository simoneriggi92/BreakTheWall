<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio: la consolle</title>
<style>
:root {
  --bg: #f3f1ec; --card: #fbfaf7; --ink: #1d2630; --muted: #66707b; --line: #dedad1; --slate: #1f2b38;
  --coral: #e5533d; --coral-soft: #fde3dc; --cyan: #1f97cf; --cyan-soft: #e2f1fa; --amber: #c47a12;
  --dock: 210px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: grid; grid-template-rows: 44px 1fr; overflow: hidden; }
header { background: var(--slate); color: #eef2f6; display: flex; align-items: center; gap: 14px; padding: 0 18px; }
header strong { font-size: 16px; letter-spacing: .01em; }
header .sep { width: 1px; height: 20px; background: #4a5a6b; }
header .mode { color: #c9d3de; font-size: 15px; }
header .spacer { flex: 1; }
header .src { color: #c9d3de; font-size: 13px; }
header button { background: transparent; border: 1px solid #4a5a6b; color: #e6ebf0; border-radius: 7px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
#app { display: grid; grid-template-columns: 216px 1fr 300px; grid-template-rows: 1fr var(--dock); min-height: 0; }
/* left: the path through the source */
#path { grid-row: 1 / 3; background: var(--card); border-right: 1px solid var(--line); overflow: auto; padding: 14px 12px 14px 14px; }
#path h2 { font-size: 15px; margin: 0 0 2px; }
#path .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.step { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px 7px 10px; border-radius: 8px; cursor: pointer; font: inherit; color: var(--ink); border-left: 3px solid transparent; }
.step:hover { background: #f1eee7; }
.step.on { background: var(--coral-soft); border-left-color: var(--coral); }
.step .t { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.step .n { color: var(--muted); font-weight: 500; margin-right: 4px; }
.step .roles { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px; }
.role { font-size: 10.5px; padding: 0 6px; border-radius: 999px; line-height: 17px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.role.add { background: #e8eef6; color: #2c4f75; } .role.back { background: #f0ece3; color: #6b5a3b; } .role.rel { background: var(--cyan-soft); color: #145f86; } .role.ctx { background: #efefef; color: #777; }
.legend { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: grid; gap: 4px; }
/* centre: the object */
#stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 4px; flex-wrap: wrap; }
#back { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
#back[disabled] { opacity: .45; cursor: default; }
#crumb { font-size: 14px; color: var(--muted); }
#crumb b { color: var(--ink); font-weight: 600; } #crumb .cur { color: var(--coral); font-weight: 600; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--cyan-soft); color: #145f86; }
#canvas { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
#upper { flex: 1 1 100%; min-height: 0; position: relative; transition: flex-basis .38s cubic-bezier(.2,.8,.2,1), opacity .25s; }
#upper svg, #lower svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#link, #lower { display: none; }
#canvas.stacked #upper { flex: 0 0 30%; opacity: .5; }
#canvas.stacked #upper:hover { opacity: .85; }
#canvas.stacked #link { display: flex; align-items: center; justify-content: center; gap: 6px; height: 24px; font-size: 13px; font-weight: 600; color: var(--coral); border-top: 1px dashed #e9b2a6; }
#canvas.stacked #link .muted { color: var(--muted); font-weight: 400; font-size: 12px; }
#canvas.stacked #lower { display: block; flex: 1 1 auto; min-height: 0; position: relative; }
#bar .spacer { flex: 1; }
.nb { border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
.nb.on { border-color: #a9cfe6; background: var(--cyan-soft); color: #145f86; }
#stepnav { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.ghost { fill: rgba(255, 255, 255, .35); stroke: #9aa3ad; stroke-width: 1; stroke-dasharray: 4 4; }
.arrive { animation: arrive .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes arrive { from { transform: translateY(-46px); opacity: 0; } }
.joint.arrive .cable.c { stroke-dasharray: 900; animation: drawc 1s ease-out both; }
@keyframes drawc { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
#mini { position: relative; width: 100%; height: 118px; margin: 6px 0 12px; background: rgba(251, 250, 247, .94); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
#mini svg { width: 100%; height: 100%; }
#mini .here { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--coral); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
#keys { position: absolute; left: 16px; bottom: 6px; font-size: 11.5px; color: var(--muted); }
#keys kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--card); }
#tip { position: fixed; pointer-events: none; background: var(--slate); color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 7px; z-index: 20; display: none; max-width: 260px; }
#tip b { display: block; font-size: 12.5px; }
/* right: the inspector */
#inspector { background: var(--card); border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px; }
#inspector .kind { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--coral); font-weight: 600; }
#inspector h2 { font-size: 20px; line-height: 1.2; margin: 4px 0 6px; }
#inspector h3 { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 14px 0 5px; }
#inspector p { margin: 4px 0; }
#inspector ul { margin: 4px 0; padding-left: 17px; } #inspector li { margin: 3px 0; }
.box { border-radius: 9px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
.box.obj { background: #eef2f6; } .box.lim { background: #fdf1e3; color: #6d4511; } .box.meta { background: #f2efe8; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.btn.primary { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 600; }
.link { border: 0; background: none; color: #145f86; cursor: pointer; padding: 0; font: inherit; font-size: 13px; text-align: left; }
.cite { font: 11.5px ui-monospace, Menlo, monospace; background: var(--cyan-soft); color: #145f86; border: 0; border-radius: 5px; padding: 1px 6px; cursor: pointer; }
/* bottom: the source dock */
#dock { grid-column: 2 / 4; border-top: 1px solid var(--line); background: #fdfcf9; display: flex; flex-direction: column; min-height: 0; position: relative; }
#grip { position: absolute; top: -5px; left: 0; right: 0; height: 10px; cursor: ns-resize; z-index: 2; }
#grip::after { content: ""; position: absolute; left: 50%; top: 3px; width: 46px; height: 4px; margin-left: -23px; border-radius: 3px; background: #cfc9bc; }
#dockbar { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
#dockbar .t { font-weight: 600; } #dockbar .r { color: var(--muted); } #dockbar .spacer { flex: 1; }
#dockbar button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 1px 8px; cursor: pointer; font: inherit; font-size: 12px; }
#lines { overflow: auto; flex: 1; font: var(--fs, 13px)/1.6 ui-monospace, Menlo, monospace; padding: 4px 0 10px; }
.ln { display: grid; grid-template-columns: 50px 1fr; padding-right: 16px; white-space: pre-wrap; }
.ln > span:first-child { color: #aaa295; text-align: right; padding-right: 12px; user-select: none; }
.ln.pass { background: #f4f1ea; }
.ln.hit { background: var(--coral-soft); box-shadow: inset 3px 0 0 var(--coral); }
.ln.pre { background: #eaf4fb; }
/* svg */
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.ff, .fr, .ft { stroke-width: .8; stroke-linejoin: round; }
.hl { fill: none; stroke: rgba(255, 255, 255, .85); stroke-width: 1.1; }
.part { cursor: pointer; outline: none; }
.part:hover, .part:focus-visible { filter: drop-shadow(0 0 2.5px rgba(229, 83, 61, .85)); }
.part.sel .ft { fill: #f8b9ab !important; } .part.sel .ff { fill: #ef8b77 !important; } .part.sel .fr { fill: #d96a55 !important; }
.part.sel .ff, .part.sel .fr, .part.sel .ft { stroke: #9e3423 !important; }
.part.inpass:not(.sel) { filter: drop-shadow(0 0 3px rgba(31, 151, 207, .9)); }
.dim { opacity: .26; pointer-events: none; }
.part.opened .ft { fill: #fbd3c9 !important; } .part.opened .ff { fill: #f4ab9b !important; } .part.opened .fr { fill: #e48d7a !important; }
.cable { fill: none; stroke-linecap: round; }
.cable.under { stroke: rgba(20, 30, 40, .22); stroke-width: 6; }
.cable.c { stroke: var(--cyan); stroke-width: 2.8; }
.cable.dep { stroke: #7a8591; stroke-width: 2.4; stroke-dasharray: 2 5; }
.joint { cursor: pointer; }
.joint:hover .c, .joint.sel .c { stroke: var(--coral); }
.jl rect { fill: #fff; stroke: #9fcbe6; } .jl text { font-size: 11.5px; fill: #145f86; font-weight: 600; }
.jl.dep rect { stroke: #b8c0c8; } .jl.dep text { fill: #4f5a66; }
.guide { fill: none; stroke: #8796a6; stroke-width: 1; stroke-dasharray: 3 4; }
.plate-t { font-weight: 700; letter-spacing: .06em; }
#note { position: fixed; inset: 0; background: rgba(15, 22, 30, .5); display: none; place-items: center; z-index: 30; }
#note.on { display: grid; }
#note .card { background: var(--card); width: min(860px, 94vw); max-height: 86vh; overflow: auto; border-radius: 14px; padding: 20px 24px; }
#note table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
#note th, #note td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px 8px; vertical-align: top; }
#insp .lead { font-size: 15px; line-height: 1.4; margin: 2px 0 8px; } #insp .muted, .muted { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 4px; }
.pts { list-style: none; padding: 0 !important; margin: 8px 0 !important; display: grid; gap: 6px; }
.pts li { display: grid; grid-template-columns: 16px 1fr; gap: 4px; margin: 0 !important; font-size: 13.5px; line-height: 1.4; }
.pts li > :nth-child(n+3) { grid-column: 2; }
.pts .mk { color: var(--muted); font-weight: 700; text-align: center; } .pts .m-caveat .mk { color: #b5651d; } .pts .m-keeps .mk { color: #2c4f75; }
.pts.rel li { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.stepchip { min-width: 26px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 1px 6px; font: inherit; font-size: 12px; cursor: pointer; } .stepchip:hover { border-color: var(--coral); }
.fold { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; } .fold summary { cursor: pointer; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 0; }
.fold > div { font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <strong>Break the Wall</strong><span class="sep"></span><span class="mode">Laboratorio</span>
  <span class="spacer"></span>
  <span class="src" id="srcname"></span>
  <button id="noteBtn">Come è costruito</button>
</header>
<div id="app">
  <nav id="path"></nav>
  <section id="stage">
    <div id="bar"><button id="back" disabled>← Torna all’insieme</button><span id="crumb"></span><span class="chip">Oggetto proposto: consolle con programmatore a camme</span><span class="spacer"></span><span id="stepnav"><button class="nb" data-act="prev" aria-label="Passo precedente">◀</button><span id="stepn"></span><button class="nb" data-act="next" aria-label="Passo successivo">▶</button></span><button id="buildBtn" class="nb"></button></div>
    <div id="canvas"><div id="upper"><svg id="svg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="L’insieme"></svg></div><div id="link"></div><div id="lower"><svg id="svgSub" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Il livello aperto"></svg></div><div id="keys"><kbd>Tab</kbd> pezzi · <kbd>Invio</kbd> scegli o apri · <kbd>Esc</kbd> torna · <kbd>←</kbd><kbd>→</kbd> passaggi</div></div>
  </section>
  <aside id="inspector"><div id="mini" title="L’insieme: premi per tornarci"></div><div id="insp"></div></aside>
  <section id="dock"><div id="grip" title="Trascina per ridimensionare"></div><div id="dockbar"><span class="t">Fonte originale</span><span class="r" id="dockr"></span><span class="spacer"></span><button id="fsm">A−</button><button id="fsp">A+</button></div><div id="lines"></div></section>
</div>
<div id="tip"></div>
<div id="note"><div class="card" id="notecard"></div></div>
<script src="../guided-reading/data.js"></script>
<script>
'use strict';
const D = window.DISASSEMBLIES.importer;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ===== 1. What comes from the disassembly =====
const parts = {}, parent = {}, joints = [];
(function walk(ps, par) { for (const p of ps) { parts[p.id] = p; parent[p.id] = par; if (p.parts) walk(p.parts, p.id); for (const j of p.joints || []) joints.push({ ...j, level: p.id }); } })(D.parts, null);
for (const j of D.joints) joints.push({ ...j, level: null });
const topOf = id => parent[id] ? topOf(parent[id]) : id;
const SRC = D.sources[0], LINES = SRC.text.split('\n');
const overlaps = (a, b) => a.some(x => b.some(y => x.from <= y.to && y.from <= x.to));
const rangeTxt = cs => cs.map(c => c.from === c.to ? c.from : `${c.from}–${c.to}`).join(', ');

// The path: one step per section of the source. What each section does comes from the citations, never from the order of the paragraphs.
const STEPS = (() => {
  const heads = []; LINES.forEach((l, i) => { if (/^#{1,2} /.test(l)) heads.push({ from: i + 1, title: l.replace(/^#+\s*/, '') }); });
  heads.forEach((h, k) => { h.to = k + 1 < heads.length ? heads[k + 1].from - 1 : LINES.length; });
  const seen = new Set();
  return heads.map((h, k) => {
    const range = [{ from: h.from, to: h.to }];
    const cited = [...new Set(Object.values(parts).filter(p => overlaps(p.cites || [], range)).map(p => topOf(p.id)))];
    const add = cited.filter(id => !seen.has(id)), back = cited.filter(id => seen.has(id));
    add.forEach(id => seen.add(id));
    const rel = joints.filter(j => j.level === null && overlaps(j.cites || [], range));
    return { ...h, k, add, back, rel, parts: cited };
  });
})();
// When each part enters the object (the section that first cites it), and each relation (the first section that cites it).
const INTRO = {}; STEPS.forEach(s => s.add.forEach(id => { INTRO[id] = s.k; }));
const JSTEP = {}; joints.filter(j => j.level === null).forEach(j => { const s = STEPS.find(s => overlaps(j.cites || [], [s])); JSTEP[j.from + '>' + j.to] = s ? s.k : Math.max(INTRO[j.from], INTRO[j.to]); });
const stepsOf = id => STEPS.filter(s => s.parts.includes(id) || (parts[id].cites && overlaps(parts[id].cites, [s])));
// Which step of the round writes a register: the sub-part that cites the same lines as the joint.
const writer = j => (parts.round.parts || []).find(q => overlaps(q.cites || [], j.cites || []));
const scenario = D.runs.find(r => r.type === 'scenario');
const VARS = { ...scenario.vars };
const varFor = name => { const w = s => s.toLowerCase().normalize('NFD').replace(/[^a-z ]/g, ' ').split(/\s+/).filter(x => x.length >= 4); const mine = new Set(w(name)); return Object.keys(VARS).find(k => w(k).some(x => mine.has(x))); };

// ===== 2. What is drawn by hand: the object =====
// Each component: what it is in the object, and where the analogy stops. The names, roles and joints stay the disassembly's.
const OBJ = {
  round: { look: 'Il programmatore a camme al centro: un tamburo con cinque camme gira sempre nello stesso verso, e ogni camma aziona un passo.', limit: 'Un tamburo gira a velocità costante; un passo del giro dura quanto serve, e lo scaricamento può non finire mai. Qui un blocco è il tamburo che si ferma sulla camma 3.' },
  'round-stamp': { look: 'Camma 1: la prima a toccare il suo pulsante, a ogni giro.', limit: 'Il pulsante preme il timbro; nella fonte il giro scrive un’ora in memoria e su un file.' },
  'round-switch': { look: 'Camma 2: tasta l’interruttore di pausa prima di proseguire.', limit: 'Una camma non decide; qui «decidere» è il ramo in cui il giro annota la pausa e si ferma.' },
  'round-fetch': { look: 'Camma 3: il punto in cui il tamburo può incepparsi.', limit: 'Il feed è fuori dalla consolle: il disegno mostra solo il passo che lo chiama.' },
  'round-hand': { look: 'Camma 4: passa i record ai worker e prosegue senza aspettarli.', limit: 'I worker non sono disegnati: la fonte non li descrive come parti.' },
  'round-close': { look: 'Camma 5: l’ultima, l’unica che scrive l’ora di fine.', limit: 'Dopo la camma 5 il giro dorme; il tamburo non ha un motore che lo faccia ripartire.' },
  heartbeat: { look: 'Un registro con display a sinistra, accanto alla camma 1: mostra quanto è vecchio l’ultimo timbro.', limit: 'Il display mostra l’età; nella fonte il timbro è un’ora in memoria e su un piccolo file.' },
  finished: { look: 'Un registro gemello a destra, accanto alla camma 5, con la bandierina d’arrivo.', limit: 'Non dice nulla dei singoli record: per quelli c’è il nastro.' },
  outcomes: { look: 'Una stampante a nastro davanti al tamburo: una riga per record.', limit: 'Il nastro mostra quattro righe di esempio; il registro vero ha una riga per ogni record ricevuto.' },
  pause: { look: 'Un selettore a chiave sul banco, che la camma 2 legge.', limit: 'Nella fonte l’interruttore sta nel servizio di configurazione, fuori dalla macchina: qui è sul banco perché si veda chi lo legge.' },
  restart: { look: 'Un relè di controllo con un quadrante a 30 minuti, collegato soltanto al timbro.', limit: 'Il relè non mostra i cinque minuti di tolleranza dopo un avvio.' },
  board: { look: 'Il pannello alto sul retro: tre spie, una per cavo in ingresso.', limit: 'Il pannello vero è una pagina per chi è di turno, non un pezzo della macchina.' },
};

// ===== 3. Geometry: a cabinet view, front faces almost frontal so their labels read =====
const KX = [0.95, 0.16], KY = [0.46, -0.34];
const VIEW = [1, -2.065];               // the direction towards the viewer, in plan
let BB = null;
const P = (x, y, z = 0) => { const p = [x * KX[0] + y * KY[0], x * KX[1] + y * KY[1] - z]; if (BB) { BB[0] = Math.min(BB[0], p[0]); BB[1] = Math.min(BB[1], p[1]); BB[2] = Math.max(BB[2], p[0]); BB[3] = Math.max(BB[3], p[1]); } return p; };
const f1 = n => Math.round(n * 10) / 10;
const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const mat = (a, b, c, d, [e, f]) => `matrix(${a},${b},${c},${d},${f1(e)},${f1(f)})`;
const onFront = (x, y, z) => mat(KX[0], KX[1], 0, 1, P(x, y, z));        // face y = const: u along x, v down
const onTop = (x, y, z) => mat(KX[0], KX[1], -KY[0], -KY[1], P(x, y, z)); // origin at the back edge: u along x, v towards the front
const onSide = (x, y, z) => mat(KY[0], KY[1], 0, 1, P(x, y, z));          // face x = const: u along y, v down
const MAT = {
  alu: ['url(#aluT)', 'url(#aluF)', 'url(#aluR)', '#77818c'],
  ivory: ['#fbfaf6', 'url(#ivF)', '#d8d7d2', '#8d949b'],
  dark: ['#4d5966', '#36424e', '#2a343e', '#1b232b'],
  steel: ['#c9cfd5', '#aab2ba', '#949da6', '#5d6772'],
};
const poly = (p, fill, cls, stroke) => `<polygon class="${cls}" points="${pts(p)}" fill="${fill}" stroke="${stroke}"/>`;
function box(x, y, z, w, d, h, m) {
  const M = MAT[m];
  const f = [P(x, y, z), P(x + w, y, z), P(x + w, y, z + h), P(x, y, z + h)];
  const r = [P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)];
  const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];

<p style="margin-top:14px"><b>Fatto a mano:</b> la scelta dell’oggetto, la forma e la posizione di ogni pezzo, i materiali, i punti in cui i cavi si attaccano, il testo «Nell’oggetto» e «Dove finisce l’analogia».<br>

<b>Costruzione progressiva</b> (attiva di default, si spegne dalla barra): un pezzo compare nel passaggio che lo cita per primo; prima è un’impronta tratteggiata sul banco. Un cavo compare dal primo passaggio che cita il giunto, quando entrambi i pezzi ci sono.<br><b>Apertura in pila:</b> il livello aperto compare sotto l’insieme, che resta sopra, trasparente e premibile: un pezzo con parti si apre al posto del livello sotto, un altro pezzo chiude il livello e resta scelto, lo sfondo riporta all’insieme.<br><b>Interattivo davvero:</b> passaggio del mouse (nome, azione, righe della fonte in anteprima), scelta di un pezzo o di una relazione, apertura del giro (clic ripetuto, doppio clic, Invio o ↓), ritorno (pulsante, miniatura, Esc o ↑) con il punto di lettura ripristinato, passaggi con ← →, fonte ridimensionabile e con dimensione del testo regolabile.<br>
<b>Non c’è:</b> la prova sotto carico, la ricomposizione, un’immagine generata. Il disegno è SVG fatto a mano: niente generazione di immagini in questo ambiente.</p>
