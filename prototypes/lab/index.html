<!doctype html>
<html lang="it" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Break the Wall · Laboratorio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 20'%3E%3Cg fill='none' stroke='%231d2733' stroke-width='1.6'%3E%3Crect x='1' y='12' width='8' height='6'/%3E%3Crect x='10' y='12' width='8' height='6'/%3E%3Crect x='19' y='12' width='8' height='6'/%3E%3Crect x='5' y='5' width='8' height='6'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="lab.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 28 20" aria-hidden="true" class="logo">
        <rect x="1" y="12" width="8" height="6" /><rect x="10" y="12" width="8" height="6" /><rect x="19" y="12" width="8" height="6" />
        <rect x="5" y="5" width="8" height="6" /><rect x="16" y="2" width="8" height="6" transform="rotate(12 20 5)" />
      </svg>
      <span>Break the Wall</span><small>laboratorio</small>
    </div>
    <label class="picker">
      <span class="sr">Smontaggio</span>
      <select id="picker"></select>
    </label>
    <nav class="modes" id="modes" aria-label="Modalità">
      <button data-mode="explode">Esploso</button>
      <button data-mode="run">Fai girare</button>
      <button data-mode="reassemble">Rimonta</button>
      <button data-mode="bom">Distinta <span id="bom-badge" class="badge"></span></button>
    </nav>
    <button id="theme" class="ghost" title="Cambia tavola">Blueprint</button>
  </header>

  <main class="desk">
    <section class="sheet" aria-label="Tavola">
      <div class="sheet-head">
        <nav id="crumbs" class="crumbs" aria-label="Livelli"></nav>
        <p id="question" class="question"></p>
      </div>
      <div id="drawing" class="drawing"></div>
      <div id="panel" class="panel"></div>
    </section>
    <aside class="side">
      <article id="card" class="card"></article>
      <section class="source">
        <header id="source-head" class="source-head"></header>
        <ol id="source" class="lines"></ol>
      </section>
    </aside>
  </main>
  <script type="module" src="lab.js"></script>
</body>
</html>
