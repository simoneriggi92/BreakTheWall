<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oggetto: tre approcci</title>
<style>
:root {
  --bg: #f4f1ea; --card: #fffdf8; --ink: #1f2328; --muted: #6b6f76; --line: #ddd6c7;
  --accent: #e5533d; --accent-soft: #fde4de; --blue: #2b7bb9; --ok: #2f9e5b; --warn: #d99a1e; --bad: #d0453a; --grey: #9aa1a9;
  --invent: #e8892b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: grid; grid-template-rows: auto 1fr 190px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 18px; background: #1f2a36; color: #f2f4f7; }
header strong { font-size: 15px; margin-right: 6px; }
.seg { display: inline-flex; background: #2d3a48; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: #c9d2dc; padding: 6px 11px; border-radius: 7px; font: inherit; cursor: pointer; }
.seg button.on { background: #f4f1ea; color: #1f2328; font-weight: 600; }
header .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
.btn:hover { border-color: #b9b1a0; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.ghost { background: transparent; }
header .btn { background: #f4f1ea; border: 0; }
main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
#stage { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
#stagebar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; flex-wrap: wrap; }
#crumb { color: var(--muted); font-size: 13px; }
#crumb b { color: var(--ink); }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #dcecf7; color: #1c5f8f; font-size: 12.5px; }
.chip.warn { background: #fdebd6; color: #8a4b0c; }
#svgwrap { flex: 1; min-height: 0; position: relative; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#controls { padding: 8px 16px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); background: #f8f5ee; min-height: 54px; }
#controls .label { color: var(--muted); font-size: 12.5px; }
#controls .say { flex-basis: 100%; font-size: 13.5px; }
#controls .say em { color: var(--muted); font-style: normal; }
.opt { display: block; text-align: left; margin: 4px 0; }
.opt.right { border-color: var(--ok); background: #e5f4ea; }
.opt.wrong { border-color: var(--bad); background: #fbe5e2; }
aside { overflow: auto; padding: 16px 18px; background: var(--card); }
aside h2 { font-size: 19px; margin: 2px 0 6px; line-height: 1.25; }
aside h3 { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
aside .kind { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
aside ul { padding-left: 18px; margin: 4px 0; }
aside li { margin: 3px 0; }
.meta { background: #f3efe6; border-radius: 8px; padding: 9px 11px; margin-top: 10px; }
.meta .lim { color: var(--muted); margin-top: 6px; }
.note { border-left: 3px solid var(--line); padding-left: 10px; color: #3d4248; }
.cite { font: 12px ui-monospace, Menlo, monospace; background: #eef3f8; color: #1c5f8f; border: 0; border-radius: 5px; padding: 2px 7px; margin: 2px 4px 2px 0; cursor: pointer; }
.verdict { padding: 8px 11px; border-radius: 8px; margin-top: 8px; }
.verdict.falls { background: #fbe5e2; } .verdict.holds { background: #e5f4ea; }
#source { overflow: auto; border-top: 1px solid var(--line); background: #fbf9f4; padding: 8px 0; font: 12.5px/1.55 ui-monospace, Menlo, monospace; }
#source .head { font: 600 12px -apple-system, sans-serif; color: var(--muted); padding: 0 16px 6px; }
#source .ln { display: grid; grid-template-columns: 52px 1fr; white-space: pre-wrap; padding: 0 16px 0 0; }
#source .ln span:first-child { color: #a39c8d; text-align: right; padding-right: 12px; }
#source .ln.hit { background: #fde4de; }
#source .gap { color: #b3ab9b; padding-left: 64px; }
/* svg */
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.box polygon, .cyl path, .cyl ellipse { stroke: #5b6470; stroke-width: .7; stroke-linejoin: round; }
.part { cursor: pointer; }
.part:hover .ft { filter: brightness(1.04); }
.part.sel .ft { fill: #f9b6a8 !important; } .part.sel .fl { fill: #ee8b78 !important; } .part.sel .fr { fill: #df6e59 !important; }
.part.sel .box polygon, .part.sel .cyl path, .part.sel .cyl ellipse { stroke: #9b2f1f; }
.faded { opacity: .2; pointer-events: none; }
.callout line { stroke: #3d4651; stroke-width: .8; }
.callout text { font-size: 12.5px; font-weight: 600; fill: #1f2328; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.callout.sel text { fill: var(--accent); }
.callout { cursor: pointer; }
.pill rect { fill: #e3f0fa; stroke: #a7cbe6; }
.pill text { font-size: 11px; fill: #1c5f8f; }
.pill.inv rect { fill: #fdebd6; stroke: var(--invent); } .pill.inv text { fill: #8a4b0c; }
.pill.red rect { fill: #fbe5e2; stroke: #e8a59b; } .pill.red text { fill: #9b2f1f; }
.wire { fill: none; stroke: #3a8fd0; stroke-width: 2.2; stroke-linejoin: round; }
.wire.t-depends-on { stroke-dasharray: 2 4; stroke: #6c7a89; }
.wire.flow { stroke: var(--accent); stroke-width: 3.2; stroke-dasharray: 7 6; animation: flow .8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -26; } }
.led { stroke: #3d4651; stroke-width: .6; fill: #c9ced4; }
.s-active .led { fill: var(--warn); } .s-ok .led, .s-restored .led { fill: var(--ok); } .s-failed .led { fill: var(--bad); }
.s-active .ft { animation: pulse 1.2s ease-in-out infinite; }
.s-failed .ft { fill: #f2c7c0 !important; }
@keyframes pulse { 50% { filter: brightness(1.12) drop-shadow(0 0 4px #f5b041); } }
.lcd { fill: #24323f; stroke: #11181f; stroke-width: .6; }
.lcdt { fill: #8ef0b4; font: 600 10.5px ui-monospace, Menlo, monospace; }
.lamp { stroke: #3d4651; stroke-width: .6; }
.paneltext { font-size: 8.5px; fill: #1f2328; }
.plate-title { font: 700 11px -apple-system, sans-serif; letter-spacing: .12em; fill: #46505b; }
.lid polygon { fill: rgba(190, 214, 232, .16) !important; stroke: #8aa3b8; stroke-width: .8; }
.guide { stroke: #8aa3b8; stroke-dasharray: 3 4; stroke-width: .8; fill: none; }
.station-dot { fill: #fff; stroke: #5b6470; stroke-width: .8; }
.station-n { font: 700 8px -apple-system, sans-serif; fill: #1f2328; }
.crack { fill: none; stroke: var(--bad); stroke-width: 2; }
.removed { opacity: .12; }
.tilt { transition: transform .6s ease; }
/* 2D scenes */
.wall { fill: #efe9dc; stroke: #8f8676; stroke-width: 1.2; }
.floor { stroke: #8f8676; stroke-width: 2; }
.inv { stroke: var(--invent) !important; }
.hatch-inv { fill: url(#hatch); }
.tag rect { fill: #fff; stroke: #c7bfae; } .tag text { font-size: 12px; fill: #3d4248; }
.tag.part rect { cursor: pointer; }
.metatext { font-size: 13px; fill: #3d4248; }
.limittext { font-size: 13px; fill: #8a4b0c; }
.station rect.body { fill: #e7eaee; stroke: #5b6470; stroke-width: 1; }
.station.sel rect.body { fill: #f9b6a8; stroke: #9b2f1f; }
.track { stroke: #5b6470; stroke-width: 4; fill: none; }
.track2 { stroke: #a7afb8; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
.shuttle { transition: transform .35s ease; }
.reg rect.body { fill: #f4f6f8; stroke: #5b6470; }
.reg.sel rect.body { fill: #f9b6a8; stroke: #9b2f1f; }
.small { font-size: 11.5px; fill: #5b6470; }
.mid { font-size: 13px; fill: #1f2328; }
.big { font-size: 15px; font-weight: 650; fill: #1f2328; }
.mono { font-family: ui-monospace, Menlo, monospace; }
.wire2 { fill: none; stroke: #3a8fd0; stroke-width: 2; }
.wire2.dash { stroke-dasharray: 5 5; }
.wire2.dot { stroke-dasharray: 2 4; stroke: #6c7a89; }
#overlay { position: fixed; inset: 0; background: rgba(20, 26, 33, .55); display: grid; place-items: center; z-index: 10; }
#overlay[hidden] { display: none; }
#overlay .card { background: var(--card); border-radius: 14px; padding: 22px 24px; width: min(520px, 92vw); }
#overlay textarea { width: 100%; min-height: 64px; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
.peek #panel, .peek #source, .peek #controls { visibility: hidden; }
.count { position: absolute; top: 12px; right: 16px; font: 700 34px -apple-system, sans-serif; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <strong>Break the Wall · prova dell'oggetto</strong>
  <span class="seg" id="fx"><button data-fx="importer">Importatore (meccanismo)</button><button data-fx="mill">Mill (argomento)</button></span>
  <span class="seg" id="ap"><button data-ap="A">A · Moduli in un corpo</button><button data-ap="B">B · La linea del giro</button><button data-ap="C">C · Scena dalla metafora</button></span>
  <span class="spacer"></span>
  <button class="btn" id="test">Prova dei 10 secondi</button>
</header>
<main>
  <section id="stage">
    <div id="stagebar"><span id="crumb"></span><span id="chips"></span></div>
    <div id="svgwrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="controls"></div>
  </section>
  <aside id="panel"></aside>
</main>
<section id="source"></section>
<div id="overlay" hidden></div>
<script src="../guided-reading/data.js"></script>
<script>
'use strict';
const DATA = window.DISASSEMBLIES;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const state = { fx: 'importer', ap: 'A', sel: null, open: null, step: -1, answered: {}, ext: false, brick: null, sim: null };

// ---------- the disassembly, indexed
function index(d) {
  const parts = {}, parent = {}, joints = [];
  const walk = (ps, par) => { for (const p of ps) { parts[p.id] = p; parent[p.id] = par; if (p.parts) walk(p.parts, p.id); for (const j of p.joints || []) joints.push({ ...j, level: p.id }); } };
  walk(d.parts, null);
  for (const j of d.joints || []) joints.push({ ...j, level: null });
  return { parts, parent, joints };
}
let D, I;
const levelJoints = level => I.joints.filter(j => j.level === level);

// ---------- isometric geometry (approach A)
const C = 0.866, S = 0.5;
let BB;
const resetBB = () => { BB = [1e9, 1e9, -1e9, -1e9]; LBL = []; LBL_FADED = false; };
const grow = (x, y) => { BB[0] = Math.min(BB[0], x); BB[1] = Math.min(BB[1], y); BB[2] = Math.max(BB[2], x); BB[3] = Math.max(BB[3], y); };
const P = (x, y, z = 0) => { const p = [(x - y) * C, (x + y) * S - z]; grow(p[0], p[1]); return p; };
const f1 = n => Math.round(n * 10) / 10;
const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const M = (a, b, c, d, [e, f]) => `matrix(${a},${b},${c},${d},${f1(e)},${f1(f)})`;
const onTop = (x, y, z) => M(C, S, -C, S, P(x, y, z));     // u along +x, v along +y
const onLeft = (x, y, z) => M(C, S, 0, 1, P(x, y, z));     // face y = const: u along +x, v down
function box(x, y, z, w, d, h, pal, extra = '') {
  const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];
  const l = [P(x, y + d, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x, y + d, z)];
  const r = [P(x + w, y, z + h), P(x + w, y + d, z + h), P(x + w, y + d, z), P(x + w, y, z)];
  return `<g class="box ${extra}"><polygon class="fl" fill="${pal[1]}" points="${pts(l)}"/><polygon class="fr" fill="${pal[2]}" points="${pts(r)}"/><polygon class="ft" fill="${pal[0]}" points="${pts(t)}"/></g>`;
}
function cyl(cx, cy, z, r, h, pal) {
  const [X, Y0] = P(cx, cy, z), [, Y1] = P(cx, cy, z + h); const rx = r * 1.2247, ry = r * 0.7071;
  grow(X - rx, Y0 + ry); grow(X + rx, Y1 - ry);
  return `<g class="cyl"><path class="fl" fill="${pal[1]}" d="M${f1(X - rx)},${f1(Y1)} L${f1(X - rx)},${f1(Y0)} A${f1(rx)},${f1(ry)} 0 0 0 ${f1(X + rx)},${f1(Y0)} L${f1(X + rx)},${f1(Y1)} Z"/><ellipse class="ft" fill="${pal[0]}" cx="${f1(X)}" cy="${f1(Y1)}" rx="${f1(rx)}" ry="${f1(ry)}"/></g>`;
}
// Labels are collected while drawing and placed at the end, pushed apart where they overlap.
let LBL = [], LBL_FADED = false;
function pill(x, y, text, cls = '') { LBL.push({ kind: 'pill', x, y, text, cls, faded: LBL_FADED }); return ''; }
function callout(cx, cy, ztop, name, id, rise = 36, dx = 0) {
  const [a, b] = P(cx, cy, ztop + 2), [c, d] = P(cx, cy, ztop + rise);
  LBL.push({ kind: 'call', id, ax: a, ay: b, x: c + dx, y: d - 8, text: name, faded: LBL_FADED }); return '';
}
function flushLabels() {
  const L = LBL.splice(0);
  for (const l of L) { l.w = l.text.length * (l.kind === 'call' ? 7.1 : 6.1) + 14; l.h = l.kind === 'call' ? 17 : 19; }
  for (let it = 0; it < 80; it++) {
    let moved = false;
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      const a = L[i], b = L[j];
      const ox = Math.min(a.x + a.w / 2, b.x + b.w / 2) - Math.max(a.x - a.w / 2, b.x - b.w / 2);
      const oy = Math.min(a.y + a.h / 2, b.y + b.h / 2) - Math.max(a.y - a.h / 2, b.y - b.h / 2);
      if (ox > 0 && oy > 0) { const up = a.y <= b.y ? a : b, dn = up === a ? b : a; up.y -= oy / 2 + 1; dn.y += oy / 2 + 1; moved = true; }
    }
    if (!moved) break;
  }
  return L.map(l => {
    grow(l.x - l.w / 2, l.y - l.h / 2); grow(l.x + l.w / 2, l.y + l.h / 2);
    const fade = l.faded ? ' faded' : '';
    if (l.kind === 'pill') return `<g class="pill ${l.cls}${fade}" transform="translate(${f1(l.x)},${f1(l.y)})"><rect x="${f1(-l.w / 2)}" y="-9" width="${f1(l.w)}" height="18" rx="9"/><text y="4" text-anchor="middle">${esc(l.text)}</text></g>`;
    return `<g class="callout ${state.sel === l.id ? 'sel' : ''}${fade}" data-id="${l.id}"><line x1="${f1(l.ax)}" y1="${f1(l.ay)}" x2="${f1(l.x)}" y2="${f1(l.y + l.h / 2)}"/><text x="${f1(l.x)}" y="${f1(l.y + 5)}" text-anchor="middle">${esc(l.text)}</text></g>`;
  }).join('');
}
const METAL = ['#eef0f3', '#ccd1d7', '#b3bac3'], TRAY = ['#e2e5e9', '#bcc3cb', '#a6aeb8'], DARK = ['#8d97a3', '#6f7884', '#5e6672'];
const PAPER = ['#ffffff', '#ebe7df', '#dcd6cb'];

// Which run variable a part shows: a word of four letters or more shared by the variable's name and the part's name.
function varFor(part, vars) {
  const words = s => s.toLowerCase().normalize('NFD').replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length >= 4);
  const mine = new Set(words(part.name));
  return Object.keys(vars || {}).find(k => words(k).some(w => mine.has(w)));
}
function runVars() {
  const r = D.runs.find(r => r.type === 'scenario'); if (!r) return {};
  const v = { ...r.vars }; for (let i = 0; i <= state.step; i++) Object.assign(v, r.steps[i].vars || {}); return v;
}
function runEffects() {
  const r = D.runs.find(r => r.type === 'scenario'); const e = {}; if (!r) return e;
  for (let i = 0; i <= state.step; i++) Object.assign(e, r.steps[i].effect || {}); return e;
}
function runFlow() {
  const r = D.runs.find(r => r.type === 'scenario'); if (!r || state.step < 0) return [];
  return (r.steps[state.step].flow || []).map(([a, b]) => a + '>' + b);
}

// ---------- A: mechanism modules, one illustrated component per icon
function moduleA(p, x, y, z, w, d, st, vars, incoming) {
  const cx = x + w / 2, cy = y + d / 2; let s = '', top = 22;
  const led = h => { const [a, b] = P(x + w - 10, y + d - 10, z + h); return `<circle class="led" cx="${f1(a)}" cy="${f1(b)}" r="3.6"/>`; };
  const varKey = varFor(p, vars);
  switch (p.icon) {
    case 'repeat': {                       // a drum with one station per sub-part, and an arm that turns
      s += box(x, y, z, w, d, 10, METAL);
      const r = Math.min(w, d) * 0.4; s += cyl(cx, cy, z + 10, r, 16, METAL);
      const subs = p.parts || [];
      subs.forEach((q, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / subs.length; const [X, Y] = P(cx + Math.cos(a) * r * 0.76, cy + Math.sin(a) * r * 0.76, z + 26);
        s += `<circle class="station-dot" cx="${f1(X)}" cy="${f1(Y)}" r="5.2"/><text class="station-n" x="${f1(X)}" y="${f1(Y + 2.8)}" text-anchor="middle">${i + 1}</text>`; });
      s += `<g transform="${onTop(cx, cy, z + 26)}"><g>${st === 'failed' ? '' : '<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>'}<line x1="0" y1="0" x2="${f1(r * 0.55)}" y2="0" stroke="#3d4651" stroke-width="3" stroke-linecap="round"/><circle r="4" fill="#3d4651"/></g></g>`;
      top = 26; s += led(10); break;
    }
    case 'timer': case 'flag': {           // a register: a display on the front, a stamp on top
      s += box(x, y, z, w, d, 26, METAL);
      const val = varKey ? vars[varKey] : '—';
      s += `<g transform="${onLeft(x + 12, y + d, z + 21)}"><rect class="lcd" width="${w - 24}" height="15" rx="2"/><text class="lcdt" x="${(w - 24) / 2}" y="11.4" text-anchor="middle">${esc(val)}</text></g>`;
      if (varKey) s += `<g transform="${onLeft(x + 12, y + d, z + 4)}"><text class="paneltext" x="0" y="0">${esc(varKey)}</text></g>`;
      if (p.icon === 'timer') s += cyl(x + w * 0.35, y + d * 0.35, z + 26, 9, 7, DARK);
      else { const [a, b] = P(x + w * 0.35, y + d * 0.35, z + 26); s += `<line x1="${f1(a)}" y1="${f1(b)}" x2="${f1(a)}" y2="${f1(b - 30)}" stroke="#3d4651" stroke-width="1.6"/><path d="M${f1(a)},${f1(b - 30)} l16,4 l-16,6 z" fill="#3d4651"/>`; grow(a + 16, b - 32); }
      top = 26; s += led(26); break;
    }
    case 'file-text': {                    // a tape printer: a roll at the back, the paper on top and over the front edge
      s += box(x, y, z, w, d, 20, METAL);
      s += box(x + 12, y + 6, z + 20, w - 24, 16, 12, PAPER);
      s += `<g transform="${onTop(x + 14, y + 26, z + 20)}"><rect width="${w - 28}" height="${d - 26}" fill="#fff" stroke="#9aa1a9" stroke-width=".6"/>${[8, 16, 24, 32, 40].map(v => `<line x1="5" x2="${w - 36}" y1="${v}" y2="${v}" stroke="#b9c0c8" stroke-width="1.2"/>`).join('')}</g>`;
      s += `<g transform="${onLeft(x + 14, y + d, z + 20)}"><rect width="${w - 28}" height="14" fill="#fff" stroke="#9aa1a9" stroke-width=".6"/><line x1="5" x2="${w - 36}" y1="5" y2="5" stroke="#b9c0c8"/><line x1="5" x2="${w - 46}" y1="10" y2="10" stroke="#b9c0c8"/></g>`;
      top = 32; s += led(20); break;
    }
    case 'settings': {                     // a toggle with a lever
      s += box(x, y, z, w, d, 18, METAL);
      s += `<g transform="${onTop(x, y, z + 18)}"><rect x="${w / 2 - 20}" y="${d / 2 - 8}" width="40" height="16" rx="3" fill="#3d4651"/></g>`;

  if (ar) g += `<g class="part" data-id="${ar.id}">${[0, 1, 2].map(k => `<rect x="${1040 + k * 34}" y="${GY - 18}" width="32" height="16" fill="#d9a38c" stroke="#9b5b45"/>`).join('')}<rect x="1057" y="${GY - 34}" width="32" height="16" fill="#d9a38c" stroke="#9b5b45"/><text class="mid" x="1090" y="${GY - 46}" text-anchor="middle" font-weight="600" ${state.sel === ar.id ? 'fill="#e5533d"' : ''}>${esc(ar.name)}</text><text class="small" x="1090" y="${GY + 22}" text-anchor="middle">un mattone messo da parte</text></g>`;
  const rest = D.parts.filter(p => !p.metaphor && p.kind !== 'rejected');
  if (!state.ext) {
    g += `<path d="M 460 ${GY} L 460 220 L 570 150 L 680 220 L 680 ${GY}" fill="none" stroke="#b9b1a0" stroke-dasharray="6 6" stroke-width="1.6"/><text class="small" x="570" y="270" text-anchor="middle">qui andrebbe la tesi:</text><text class="small" x="570" y="286" text-anchor="middle">nessuna metafora la descrive</text>`;
    g += `<text class="mid" x="40" y="${GY + 100}" font-weight="600">Fuori dalla metafora</text>`;
    rest.forEach((p, k) => { g += tag(p.id, 40 + (k % 3) * 330, GY + 116 + Math.floor(k / 3) * 36, p.name); });
    return { svg: g, vb: '0 0 1240 560' };
  }
  // what we would have to invent, numbered and listed under the scene
  const region = D.parts.find(p => p.kind === 'consequence'), bounds = D.parts.find(p => p.kind === 'limit'), obj = D.parts.find(p => p.kind === 'objection');
  g += `<g class="part" data-id="${claim.id}"><path d="M 460 ${GY} L 460 220 L 570 150 L 680 220 L 680 ${GY} Z" class="hatch-inv" stroke="#e8892b" stroke-width="1.6"/>${inventedMark(570, 200, 'a')}</g>`;
  if (region) g += `<g class="part" data-id="${region.id}">${[0, 1, 2].map(k => `<ellipse cx="${340 + k * 50}" cy="${GY - 10}" rx="22" ry="9" class="hatch-inv" stroke="#e8892b"/>`).join('')}<ellipse cx="800" cy="${GY - 10}" rx="60" ry="11" class="hatch-inv" stroke="#e8892b"/>${inventedMark(390, GY - 30, 'b')}${inventedMark(800, GY - 30, 'b')}</g>`;
  if (bounds) g += `<g class="part" data-id="${bounds.id}"><rect x="304" y="${GY - 116}" width="56" height="34" class="hatch-inv" stroke="#e8892b"/><line x1="332" y1="${GY - 82}" x2="332" y2="${GY - 46}" stroke="#e8892b" stroke-width="2"/>${inventedMark(332, GY - 128, 'c')}</g>`;
  if (obj) g += `<g class="part" data-id="${obj.id}"><circle cx="990" cy="${GY - 66}" r="9" class="hatch-inv" stroke="#e8892b"/><rect x="982" y="${GY - 56}" width="16" height="56" rx="5" class="hatch-inv" stroke="#e8892b"/><path d="M 982 ${GY - 46} L 944 ${GY - 52}" stroke="#e8892b" stroke-width="3"/>${inventedMark(1012, GY - 80, 'd')}</g>`;
  const inv = [{ id: claim.id, n: 'a', what: 'la casa' }, region && { id: region.id, n: 'b', what: 'il giardino' }, bounds && { id: bounds.id, n: 'c', what: 'il cartello al cancello' }, obj && { id: obj.id, n: 'd', what: 'il vicino che si sporge' }].filter(Boolean);
  g += `<text class="limittext" x="40" y="${GY + 90}" font-weight="600">Tratteggio arancio = inventato: la fonte non lo dice.</text>`;
  g += inventedLegend(48, GY + 116, inv);
  g += `<text class="limittext" x="40" y="${GY + 172}">Due metafore della fonte (un edificio, una proprietà) qui diventano una scena sola: anche questa è una scelta nostra.</text>`;
  return { svg: g, vb: '0 0 1240 580' };
}

// ---------- the runs
function brickOf(id) { return D.runs.find(r => r.type === 'load')?.bricks.find(b => b.part === id); }
let timer = null;
function controls() {
  const el = $('#controls'); let h = '';
  clearInterval(timer); timer = null;
  if (state.ap === 'A' && state.fx === 'importer') {
    const r = D.runs.find(r => r.type === 'scenario'), i = state.step;
    h += `<span class="label">Prova: ${esc(r.title)}</span><button class="btn" data-act="prev" ${i < 0 ? 'disabled' : ''}>←</button><span>${i + 1} / ${r.steps.length}</span><button class="btn primary" data-act="next" ${i >= r.steps.length - 1 ? 'disabled' : ''}>${i < 0 ? 'Avvia' : 'Avanti'} →</button>`;
    if (i >= 0) { const st = r.steps[i]; h += `<div class="say"><b>${esc(st.action)}.</b> `; if (st.predict && !state.answered[i]) h += `${esc(st.predict.question)} ${st.predict.options.map((o, k) => `<button class="btn opt-in" data-opt="${k}">${esc(o.text)}</button>`).join(' ')}`; else h += `<em>${esc(st.explain || '')}</em>`; h += '</div>'; }
    else h += `<div class="say"><em>${esc(r.setup)}</em></div>`;
    if (I.parts[state.sel]?.parts && !state.open) h += `<button class="btn" data-act="open">↓ Apri «${esc(I.parts[state.sel].name)}»</button>`;
    if (state.open) h += `<button class="btn" data-act="close">↑ Torna all’insieme</button>`;
  } else if (state.ap === 'A') {
    const r = D.runs.find(r => r.type === 'load');
    h += `<span class="label">Prova: ${esc(r.title)}. ${esc(r.question)}</span>` + r.bricks.map(b => `<button class="btn ${state.brick === b.part ? 'primary' : ''}" data-brick="${b.part}">Togli «${esc(I.parts[b.part].name)}»</button>`).join('') + (state.brick ? `<button class="btn ghost" data-brick="">Rimetti</button>` : '');
    const open = state.sel && I.parts[state.sel]?.parts;
    if (open && !state.open) h += `<button class="btn" data-act="open">↓ Apri «${esc(I.parts[state.sel].name)}»</button>`;
    if (state.open) h += `<button class="btn" data-act="close">↑ Torna all’insieme</button>`;
  } else if (state.ap === 'B') {
    if (state.fx !== 'importer') { h = `<span class="label">Nessuna prova: la linea non si applica a un argomento.</span>`; el.innerHTML = h; return; }
    const s = state.sim;
    h += `<button class="btn primary" data-act="play">${s.playing ? '⏸ Ferma' : '▶ Fai girare'}</button><button class="btn" data-act="tick">+1 min</button><button class="btn" data-act="tick10">+10 min</button>`;
    h += `<span class="label">Interruttore:</span><button class="btn ${s.paused ? 'primary' : ''}" data-act="pause">${s.paused ? 'spento (pausa)' : 'acceso'}</button>`;
    h += `<span class="label">Il feed:</span>` + [['ok', 'risponde'], ['hang', 'non risponde mai'], ['refuse', 'rifiuta le chiamate']].map(([k, n]) => `<button class="btn ${s.feed === k ? 'primary' : ''}" data-feed="${k}">${n}</button>`).join('');
    h += `<button class="btn ghost" data-act="reset">Ricomincia</button>`;
    h += `<div class="say"><em>Prevedi prima di premere: se il feed non risponde mai, quale luce cambia per prima, e dopo quanto? Le regole vengono dalle righe 51–68, 156–162 e 180–208 della fonte.</em></div>`;
    if (s.playing) timer = setInterval(() => { simTick(); draw(false); }, 450);
  } else if (state.ap === 'C') {
    h += `<button class="btn ${state.ext ? 'primary' : ''}" data-act="ext">${state.ext ? 'Mostra solo ciò che viene dalla scomposizione' : 'Estendi la metafora a tutti i pezzi (inventando)'}</button><span class="label">Arancio tratteggiato = non nella fonte.</span>`;
  }
  el.innerHTML = h;
}

// ---------- panel and source
const NOTES = {
  A: { title: 'A · Moduli illustrati in un corpo', idea: 'Ogni pezzo diventa un componente disegnato davvero, preso da una biblioteca fissa (tamburo, registro con display, stampante a nastro, levetta, relè, pannello a luci), montato in un corpo che dà un nome all’insieme. Per un argomento il corpo è un telaio portante: fondazione, pilastro, trave, morsetti, cuneo.',
    computed: ['il componente, dall’icona e dal tipo che ogni pezzo ha già', 'la disposizione, dai giunti (chi alimenta chi)', 'i fili e le loro etichette, le luci del pannello (una per giunto in ingresso), i valori sui display (dalle variabili della prova)', 'nel telaio: dove sta ogni pezzo, dal suo tipo (premessa, tesi, limite…)'],
    hand: ['il disegno di ciascun componente: una volta sola, per tutte le fonti', 'il nome del corpo: nel prodotto lo proporrebbe il modello da una lista chiusa'],
    ask: 'Guardando l’insieme, sai dire che cos’è? Il telaio di Mill ti fa capire l’argomento, o suggerisce una necessità che il testo non ha?' },
  B: { title: 'B · La linea del giro', idea: 'Il meccanismo è il tempo: il giro viaggia su un binario attraverso i suoi passi e lascia segni nei registri; il pannello li legge. Lo fai girare tu: metti in pausa, blocca un feed, guarda quale luce cambia.',
    computed: ['le stazioni: i sotto-pezzi del giro, nell’ordine dei giunti', 'quale registro pende da quale stazione, quando il giunto e la stazione citano le stesse righe (timbro, ora di fine giro)'],
    hand: ['le regole della simulazione, dalle righe citate: il contratto non le contiene', 'la posizione del registro degli esiti: nessuna citazione lo lega a un passo (tratteggiato)'],
    ask: 'Il movimento ti fa capire la differenza tra pausa e blocco meglio di un disegno fermo? E Mill, che non ha un tempo, dove andrebbe?' },
  C: { title: 'C · Scena dalla metafora', idea: 'La scomposizione ha già delle metafore («il giro di una guardia notturna», «la fondazione dell’edificio», «il confine di una proprietà»). La scena le disegna: ciò che conosci risponde a «che cos’è?».',
    computed: ['quali pezzi hanno una metafora (il campo metaphor) e il suo limite', 'ciò che resta fuori, elencato a parte'],
    hand: ['la scena intera', 'quale frase della metafora corrisponde a quale passo'],
    ask: 'La scena si riconosce subito. Ma quanti pezzi copre davvero? Premi «Estendi» e guarda quanto bisogna inventare.' },
};
function sourceOf(id) { return D.sources.find(s => s.id === id) || D.sources[0]; }
function renderSource(cites) {
  const el = $('#source'); if (!cites?.length) { el.innerHTML = `<div class="head">Fonte · ${esc(D.sources[0].title)}: seleziona un pezzo per vedere le sue righe.</div>`; return; }
  const src = sourceOf(cites[0].source), lines = src.text.split('\n');
  const hit = n => cites.some(c => n >= c.from && n <= c.to);
  const show = new Set(); cites.forEach(c => { for (let n = Math.max(1, c.from - 1); n <= Math.min(lines.length, c.to + 1); n++) show.add(n); });
  let h = `<div class="head">Fonte · ${esc(src.title)} · righe ${cites.map(c => c.from === c.to ? c.from : `${c.from}–${c.to}`).join(', ')}</div>`, prev = 0;
  [...show].sort((a, b) => a - b).forEach(n => { if (prev && n > prev + 1) h += `<div class="gap">⋯</div>`; h += `<div class="ln ${hit(n) ? 'hit' : ''}"><span>${n}</span><span>${esc(lines[n - 1])}</span></div>`; prev = n; });
  el.innerHTML = h;
}
const KIND = { step: 'passo', artifact: 'registro', component: 'componente', conclusion: 'tesi', premise: 'premessa', ground: 'fondamento', limit: 'limite', objection: 'obiezione', consequence: 'conseguenza', rejected: 'scartato' };
function renderPanel() {
  const el = $('#panel'), n = NOTES[state.ap], p = state.sel && I.parts[state.sel];
  let h = '';
  if (p) {
    h += `<div class="kind">${esc(KIND[p.kind] || p.kind)}${I.parent[p.id] ? ' · dentro «' + esc(I.parts[I.parent[p.id]].name) + '»' : ''}</div><h2>${esc(p.name)}</h2><p>${esc(p.role || '')}</p>`;
    if (p.explain) h += `<p class="note">${esc(p.explain)}</p>`;
    if (p.points?.length) h += `<ul>${p.points.map(x => `<li>${esc(x.text)}</li>`).join('')}</ul>`;
    if (p.metaphor) h += `<div class="meta">«${esc(p.metaphor.text)}»<div class="lim">⚠ Dove smette di funzionare: ${esc(p.metaphor.limit)}</div></div>`;
    const js = I.joints.filter(j => j.from === p.id || j.to === p.id);
    if (js.length) h += `<h3>Giunti</h3><ul>${js.map(j => `<li>${esc(I.parts[j.from].name)} → ${esc(I.parts[j.to].name)} <span style="color:var(--muted)">(${esc(j.label || j.type)})</span></li>`).join('')}</ul>`;
    const b = state.brick === p.id && brickOf(p.id);
    if (b) h += `<div class="verdict ${b.verdict}"><b>${b.verdict === 'falls' ? 'La tesi crolla' : 'La tesi regge'}.</b> ${esc(b.explain)}${b.inference ? ' <span class="chip warn">interpretazione</span>' : ''}</div>`;
    if (p.parts && !state.open && state.ap === 'A') h += `<p><button class="btn" data-act="open">↓ Apri «${esc(p.name)}»</button></p>`;
    h += `<p><button class="btn ghost" data-act="desel">Torna alla nota sull’approccio</button></p>`;
  } else {
    h += `<div class="kind">L’approccio</div><h2>${esc(n.title)}</h2><p>${esc(n.idea)}</p><h3>Calcolato dalla scomposizione</h3><ul>${n.computed.map(x => `<li>${esc(x)}</li>`).join('')}</ul><h3>Fatto a mano in questo prototipo</h3><ul>${n.hand.map(x => `<li>${esc(x)}</li>`).join('')}</ul><h3>La domanda per te</h3><p class="note">${esc(n.ask)}</p>`;
    h += `<h3>L’insieme</h3><p><b>${esc(D.whole.name)}.</b> ${esc(D.whole.does)}</p>`;
  }
  const res = loadTests(); if (res.length) h += `<h3>Prove dei 10 secondi (solo in questo browser)</h3><ul>${res.slice(-6).reverse().map(r => `<li><b>${r.fx}/${r.ap}</b>: «${esc(r.what)}» · ${esc(r.partName)}: «${esc(r.does)}»</li>`).join('')}</ul><button class="btn ghost" data-act="cleartests">Cancella le prove</button>`;
  el.innerHTML = h;
  renderSource(p ? p.cites : D.whole.cites);
  if (state.brick && !p) { const b = brickOf(state.brick); if (b) renderSource(b.cites); }
}

// ---------- drawing
function draw(full = true) {
  D = DATA[state.fx]; I = index(D);
  document.querySelectorAll('#fx button').forEach(b => b.classList.toggle('on', b.dataset.fx === state.fx));
  document.querySelectorAll('#ap button').forEach(b => b.classList.toggle('on', b.dataset.ap === state.ap));
  const svg = $('#svg'); let body, vb;
  const BODY = { importer: 'centralina', mill: 'telaio portante' };
  if (state.ap === 'A') {
    body = state.fx === 'importer' ? renderMechA() : renderArgA();
    const pad = 30; vb = `${f1(BB[0] - pad)} ${f1(BB[1] - pad)} ${f1(BB[2] - BB[0] + 2 * pad)} ${f1(BB[3] - BB[1] + 2 * pad)}`;
    body = `<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a8fd0"/></marker></defs>` + body;
    $('#chips').innerHTML = `<span class="chip">Corpo proposto: ${BODY[state.fx]}</span>`;
  } else if (state.ap === 'B') {
    if (state.fx === 'importer') { const r = renderLineB(); body = r.svg; vb = r.vb; $('#chips').innerHTML = `<span class="chip">Corpo proposto: linea con binario</span>`; }
    else { body = `<text x="40" y="60" class="big">La linea non si applica a un argomento.</text><text x="40" y="90" class="mid">Un argomento non ha un tempo che scorre: «sostiene» non è «viene dopo».</text><text x="40" y="114" class="mid">Mettere le premesse in fila sul binario direbbe che una produce l’altra, e il testo non lo dice.</text><text x="40" y="138" class="mid">Per Mill guarda A (telaio) o C (scena).</text>`; vb = '0 0 900 200'; $('#chips').innerHTML = `<span class="chip warn">Non applicabile</span>`; }
  } else {
    const r = state.fx === 'importer' ? sceneImporter() : sceneMill(); body = r.svg; vb = r.vb;
    $('#chips').innerHTML = `<span class="chip">Metafora della scomposizione</span>${state.ext ? ' <span class="chip warn">Estesa: contiene invenzioni</span>' : ''}`;
  }
  svg.setAttribute('viewBox', vb); svg.setAttribute('preserveAspectRatio', 'xMidYMid meet'); svg.innerHTML = body;
  const open = state.open && I.parts[state.open];
  $('#crumb').innerHTML = `<b>${esc(D.whole.name)}</b>${open ? ` › <b>${esc(open.name)}</b>` : ''}`;
  if (full) { controls(); renderPanel(); }
}

// ---------- the 10-second test
function loadTests() { try { return JSON.parse(localStorage.getItem('btw:object-test:v1') || '[]'); } catch { return []; } }
function saveTests(a) { try { localStorage.setItem('btw:object-test:v1', JSON.stringify(a)); } catch {} }
function runTest() {
  const ids = D.parts.map(p => p.id), pick = ids[Math.floor(Math.random() * ids.length)];
  state.sel = pick; state.open = null; draw();
  document.body.classList.add('peek');
  const c = document.createElement('div'); c.className = 'count'; $('#svgwrap').appendChild(c);
  let n = 10; c.textContent = n;
  const iv = setInterval(() => { n -= 1; c.textContent = n; if (n > 0) return; clearInterval(iv); c.remove(); document.body.classList.remove('peek');
    const o = $('#overlay'); o.hidden = false;
    o.innerHTML = `<div class="card"><h2 style="margin-top:0">Senza guardare di nuovo</h2><p>1. Che cos’è questo oggetto, in una frase?</p><textarea id="t-what"></textarea><p>2. Che cosa fa il pezzo evidenziato, «${esc(I.parts[pick].name)}»?</p><textarea id="t-does"></textarea><p style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="t-cancel">Annulla</button><button class="btn primary" id="t-save">Salva</button></p></div>`;
    $('#t-cancel').onclick = () => { o.hidden = true; };
    $('#t-save').onclick = () => { const a = loadTests(); a.push({ fx: state.fx, ap: state.ap, what: $('#t-what').value, partName: I.parts[pick].name, does: $('#t-does').value, at: new Date().toISOString() }); saveTests(a); o.hidden = true; state.sel = null; draw(); };
  }, 1000);
}

// ---------- events
document.addEventListener('click', e => {
  const t = e.target.closest('[data-fx],[data-ap],[data-act],[data-feed],[data-brick],[data-opt],[data-id]'); if (!t) return;
  if (t.dataset.fx) { state.fx = t.dataset.fx; state.sel = null; state.open = null; state.brick = null; state.step = -1; state.answered = {}; }
  else if (t.dataset.ap) { state.ap = t.dataset.ap; state.sel = null; state.open = null; }
  else if (t.dataset.feed) { state.sim.feed = t.dataset.feed; }
  else if (t.dataset.brick !== undefined) { state.brick = t.dataset.brick || null; state.sel = state.brick || null; }
  else if (t.dataset.opt !== undefined) { const r = D.runs.find(r => r.type === 'scenario'), st = r.steps[state.step], o = st.predict.options[+t.dataset.opt]; state.answered[state.step] = true; draw(); $('#controls .say').insertAdjacentHTML('afterbegin', `<span class="chip ${o.correct ? '' : 'warn'}">${o.correct ? 'Giusto' : 'Non proprio'}: ${esc(o.why)}</span> `); return; }
  else if (t.dataset.act) {
    const a = t.dataset.act, s = state.sim;
    if (a === 'next') state.step++; else if (a === 'prev') state.step--;
    else if (a === 'open') { state.open = state.sel; } else if (a === 'close') { state.open = null; }
    else if (a === 'desel') state.sel = null; else if (a === 'ext') state.ext = !state.ext;
    else if (a === 'play') s.playing = !s.playing; else if (a === 'tick') simTick(); else if (a === 'tick10') for (let k = 0; k < 10; k++) simTick();
    else if (a === 'pause') { s.paused = !s.paused; } else if (a === 'reset') simInit();
    else if (a === 'cleartests') saveTests([]);
    if (a === 'pause' && t.closest('svg')) { /* the switch in the drawing is also a part */ }
  }
  else if (t.dataset.id) { state.sel = state.sel === t.dataset.id ? null : t.dataset.id; }
  history.replaceState(null, '', `#${state.fx}/${state.ap}`);
  draw();
});
document.addEventListener('dblclick', e => { const t = e.target.closest('[data-id]'); if (t && I.parts[t.dataset.id]?.parts && state.ap === 'A') { state.sel = t.dataset.id; state.open = t.dataset.id; draw(); } });
document.addEventListener('keydown', e => {
  if (e.target.closest?.('textarea')) return;
  if (e.key === 'ArrowDown' && state.ap === 'A' && I.parts[state.sel]?.parts) { state.open = state.sel; draw(); }
  if ((e.key === 'ArrowUp' || e.key === 'Escape') && state.open) { state.sel = state.open; state.open = null; draw(); }
});
$('#test').onclick = runTest;
{ const [fx, ap] = location.hash.slice(1).split('/'); if (DATA[fx]) state.fx = fx; if (['A', 'B', 'C'].includes(ap)) state.ap = ap; }
draw();
</script>
